# Alertmanager routing for the rules in alerts.yml.
#
# WHY THIS EXISTS. The alert rules define what is worth waking someone for. Without this, nothing
# carries them to a human — Prometheus evaluates, marks an alert firing, draws it red on a page
# nobody is looking at, and that is the end of it. "We have alerts" and "we get alerted" are
# different claims, and only the second one is worth anything at 3am.
#
# ---------------------------------------------------------------------------------------------
# TURNING PAGING ON DOES NOT MEAN EDITING THIS FILE WITH A CREDENTIAL IN IT.
#
# It used to. The instruction was "uncomment a receiver block and paste your Slack webhook in",
# which asks you to put a live credential into a file that is committed — so the only safe way to
# follow it was to not follow it, and paging stayed off.
#
# The `paging` receiver below is REAL and enabled by default. It reads its destination from
#
#     observability/secrets/paging_url        (gitignored; .example is committed)
#
# via Alertmanager's `url_file`, so the credential never enters git and nobody has to hand-write
# receiver YAML. Compose mounts that directory read-only at /etc/alertmanager/secrets.
#
# To page for real: put your Slack/PagerDuty/Opsgenie webhook URL in that file (one line, no
# quotes) and restart Alertmanager. Nothing else changes.
#
# With no file present Alertmanager still starts — `url_file` is read at NOTIFY time, not at
# load time, so a fresh clone is not broken by a missing secret; it just logs a delivery failure
# when an alert actually fires. That is the behaviour worth having: it fails LOUD at the moment
# it matters instead of silently succeeding into a black hole.
#
# VERIFIED, both halves, on 2026-09-18 rather than reasoned about:
#   * with a URL in place, a hand-fired critical alert arrived at the destination carrying its
#     runbook link -- receiver "paging", status "firing";
#   * with the file absent, Alertmanager started (ready=200) and the first alert logged
#     `notify retry canceled ... read url_file: ... no such file or directory`.
#
# NOT via an environment variable — Alertmanager does not expand them here. `${SOMETHING}` fails
# the config outright with `unsupported scheme ""` rather than waiting to be filled in. That is
# why this is a FILE and not an env var, and it was verified with `amtool check-config` rather
# than assumed — as was `url_file` itself, which needs Alertmanager >= 0.26 (this pins 0.27.0).
# ---------------------------------------------------------------------------------------------

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'rulemind-alerts@example.com'
  # smtp_auth_username: ''
  # smtp_auth_password: ''

route:
  # Group by alertname AND severity so a latency warning and a latency critical do not collapse
  # into one notification — they have different runbook entries and different urgency.
  group_by: ["alertname", "severity"]
  # Wait a little before the first notification so a burst of related alerts arrives as one
  # message rather than five. 30s is short enough that a real outage still pages promptly.
  group_wait: 30s
  group_interval: 5m
  # Do not re-notify for 4 hours. Shorter than this and a long incident becomes its own denial
  # of service on the on-call person's attention.
  repeat_interval: 4h
  receiver: "paging"

  routes:
    # THE HEARTBEAT GOES SOMEWHERE ELSE, and it must be FIRST -- routes match in order, and the
    # critical route below would otherwise be reached first by anything that shared its labels.
    #
    # Its own destination, because a dead man's switch belongs at a monitor that alerts on
    # SILENCE, not in the on-call channel. Sending it to `paging` would page a human every
    # repeat_interval to tell them nothing is wrong, which is how a heartbeat gets muted and
    # stops being a heartbeat.
    #
    # `repeat_interval: 5m` is the actual signal rate: the receiving monitor should expect one
    # every 5 minutes and alert if it has not seen one in 10-15. `group_wait: 0s` so the first
    # one after a restart is immediate rather than 30 seconds late.
    #
    # `continue: false` (the default) is deliberate -- the heartbeat must not also reach paging.
    - matchers:
        - alertname = "Watchdog"
      receiver: "watchdog"
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m

    # Critical goes to the paging destination and repeats faster: these are the two that mean
    # decisions are not being served at all.
    - matchers:
        - severity = "critical"
      receiver: "paging"
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # If the API is down, every other rule about it is a consequence, not new information.
  # Without this a single outage pages five times and the signal is buried in its own noise.
  - source_matchers:
      - alertname = "RuleMindApiDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["instance"]

  # A latency critical implies the warning. Send one.
  - source_matchers:
      - alertname = "RuleMindDecisionLatencyCritical"
    target_matchers:
      - alertname = "RuleMindDecisionLatencyHigh"
    equal: ["source"]

receivers:
  # THE REAL DESTINATION. Its URL comes from a gitignored file, so enabling paging never means
  # committing a credential — see the header. `url_file` is read at notify time, so a missing
  # file is a logged delivery failure rather than a config that refuses to load.
  - name: "paging"
    webhook_configs:
      # Through the relay, which turns this envelope into a notification with a title, a
      # priority taken from `severity`, and a tappable runbook. Sending straight to a push
      # service delivers raw JSON to a phone screen.
      #
      # A fixed in-network address rather than url_file, because the SECRET moved: the
      # destination is now observability/secrets/topic, which the relay reads at notify time.
      # The url_file reasoning is unchanged, it just applies one hop further along.
      - url: http://alert-relay:9097/
        send_resolved: true

  # THE HEARTBEAT'S DESTINATION -- a dead-man's-switch monitor, not a human.
  #
  # Same `url_file` mechanism and the same reasoning: the URL is a credential. If the file is
  # absent the heartbeat simply does not send, which is EXACTLY what an unconfigured switch
  # should look like from the outside -- silent. It cannot fail open.
  #
  # `send_resolved: false` because this alert never resolves; it is `vector(1)`.
  - name: "watchdog"
    webhook_configs:
      # NOT through the relay, and not to the paging destination either. A dead man's switch is
      # a different KIND of endpoint: it does not render a notification, it records that a ping
      # arrived, and it alerts when one stops. Sending the heartbeat to the phone instead would
      # deliver "nothing is wrong" every five minutes and detect nothing when the pipe dies --
      # the one failure it exists for.
      #
      # It also has to live OUTSIDE this stack. A monitor on the same machine shares fate with
      # what it watches: if the host dies, the heartbeat stops and so does anything here that
      # would have noticed. That is why this one URL genuinely needs an external service
      # (healthchecks.io, Opsgenie Heartbeats, Grafana OnCall, Better Stack -- all free-tier)
      # and cannot be satisfied by anything in this repo.
      - url_file: /etc/alertmanager/secrets/watchdog_url
        send_resolved: false

  # Kept so `receiver: "null"` above is still a one-word way to silence everything deliberately
  # — which is a legitimate thing to want during a planned migration, and is different from
  # having no destination configured at all.
  - name: "null"

  # The three destinations below are COMMENTED rather than left with placeholder credentials.
  #
  # Alertmanager does not expand environment variables in this file — it validates `api_url` as a
  # literal URL — so `${RULEMIND_ALERT_SLACK_WEBHOOK}` does not "wait for an env var", it fails
  # the config outright with `unsupported scheme ""`. (Found by running `amtool check-config`
  # rather than by shipping it and wondering why Alertmanager would not start.)
  #
  # So: uncomment ONE block, paste the real credential, and change `receiver: "null"` above.
  # Keep the credential out of git — mount this file from a secret, or template it at deploy.

