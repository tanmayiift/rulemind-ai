global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alerting was absent entirely: a Grafana dashboard with nothing to page anyone. A dashboard is
# for diagnosis once you already know something is wrong; these are what tell you.
rule_files:
  - /etc/prometheus/alerts.yml

# WITHOUT THIS BLOCK THE RULES ABOVE REACH NOBODY. Prometheus evaluates them, marks alerts
# firing, shows them red on its own /alerts page -- and that is the end of it. alertmanager.yml
# existed for a day before anyone noticed nothing was pointed at it, which is the whole failure
# mode this stack is supposed to prevent, reproduced inside the monitoring config itself.
#
# Check it is live: http://localhost:9090/api/v1/alertmanagers should list one ACTIVE endpoint.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Alertmanager's OWN metrics. This block was missing, and its absence was silent in the worst
  # possible way: `alerting:` above points Prometheus AT Alertmanager, which looks like the two
  # are wired together, but it only says where to SEND alerts -- it scrapes nothing. So
  # alertmanager_notifications_failed_total had no series at all, and
  # RuleMindPagingIsFailing (alerts.yml) -- the one rule whose entire job is to catch "alerts
  # are firing and NOT arriving" -- evaluated against a metric that did not exist and could
  # never fire. Measured: 440 real delivery failures in this stack's logs, and the alert
  # watching for exactly that stayed green throughout.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: rulemind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
