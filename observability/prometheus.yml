global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alerting was absent entirely: a Grafana dashboard with nothing to page anyone. A dashboard is
# for diagnosis once you already know something is wrong; these are what tell you.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rulemind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
