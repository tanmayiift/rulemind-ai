
# Alert rules for RuleMind.
#
# WHY THESE EXIST. Before this file, `observability/` had a Grafana dashboard and no alerting
# block or rule_files at all — you could look at graphs, but nothing told anyone when something
# broke. A dashboard is for diagnosis after you already know; alerts are what tell you.
#
# EVERY EXPRESSION HERE USES A SERIES THAT PROVABLY EXISTS. They were checked by scraping
# /metrics on a running stack, not read off the source. That check is the reason this file could
# be written at all: it found that `/api/v1/decide` emitted NOTHING — both decision metrics were
# incremented only on the SDK path — so half these rules would have been permanently silent
# while looking correctly configured. A rule that can never fire is worse than a missing rule,
# because it reads as coverage.
#
# Series in use, with their labels:
#   rulemind_decisions_total{outcome, source}          counter
#   rulemind_decision_latency_seconds{source}          histogram (_bucket/_sum/_count)
#   rulemind_bundle_syncs_total{status}                counter
#   up{job}                                            the scrape itself
#
# ── THRESHOLD CALIBRATION ─────────────────────────────────────────────────────────────────────
#
# These were guesses in the first version of this file (p95 > 500ms / > 2s, round numbers chosen
# because they sounded reasonable). They are now derived from MEASURED data plus the product's
# own stated objective. The derivation is here because a threshold whose origin nobody can
# reconstruct gets "tuned" during the first incident by whoever is most tired.
#
# Two fixed points:
#   * the product's default SLO         p95 <= 100 ms   (app/slo.py default_slo_config)
#   * the evaluation budget            10,000 ms        (executor DEFAULT_BUDGET_MS) -- past this
#                                                       the caller gets a 504, so alerts must
#                                                       fire well before it
#
# Measured on reference hardware (2 uvicorn workers, laptop, Colima VM; rate limiting disabled
# so the engine is what is being measured — see docs/PERFORMANCE.md):
#
#     conc    p95        rps     meets the 100ms SLO?
#     1       51.6 ms    32.8    yes
#     4      102.8 ms    59.7    no (at the line)
#     8      164.8 ms    78.1    no
#     16     212.2 ms    93.5    no   <- max-throughput knee
#     32     547.1 ms    87.3    no
#     64    1401.0 ms    82.1    no
#
# THE UNCOMFORTABLE RESULT, recorded rather than smoothed over: the product's own default SLO is
# only met at concurrency 1, and is already at the line by concurrency 4. Max throughput (~94
# rps) arrives at roughly TWICE the SLO latency. So "SLO-respecting capacity" (~60 rps) and
# "maximum capacity" (~94 rps) are different numbers, and the first is the one to size against.
#
# Hence the thresholds below are NOT set at the SLO value: alerting at 100 ms would fire
# continuously on reference hardware and be silenced within a week. They are set where genuine
# degradation begins, above the measured knee:
#
#   warning   p95 > 250 ms   just past the knee's 212 ms — real degradation, no flapping
#   critical  p95 > 1000 ms  only seen beyond 4x the knee; 10x the SLO; still 10x clear of the
#                            evaluation budget, so it fires long before callers see 504s
#
# ONE CAVEAT ON THAT TABLE, found while soak-testing these very thresholds: it was measured
# during a RAMP (1 -> 4 -> 8 -> 16 -> 32 -> 64 in sequence), so each row carries queue buildup
# from the step before it. Held at a STEADY concurrency of 32 instead, p95 settles at ~242ms,
# not the 547ms the ramp row shows -- less than half. Ramp latency and steady-state latency are
# different measurements of different things, and the ramp figure is the pessimistic one.
#
# It was NOT decision volume: the steady-state run had 22,925 rows in `decisions` against the
# ramp's 11,801, i.e. nearly twice the data and half the latency. Worth knowing before blaming
# table growth for a latency change.
#
# The practical consequence: 250ms sits close to steady-state p95 at concurrency 32 (242ms). It
# is deliberately a tripwire rather than a comfort zone -- but if it proves noisy in production,
# the fix is to raise it with a recorded reason, not to silence the rule.
#
# RE-DERIVE THESE FROM YOUR OWN TRAFFIC after the first month. The table above is a laptop, and
# a threshold calibrated against someone else's hardware is still a guess.

groups:
  - name: rulemind-availability
    rules:
      - alert: RuleMindApiDown
        expr: up{job="rulemind-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The RuleMind API is not being scraped"
          description: >-
            Prometheus cannot reach {{ $labels.instance }}. Either the process is gone or it
            cannot serve /metrics. Check `/health` (liveness) and `/ready` (dependencies) —
            they answer differently on purpose, and /ready is the one that reports the
            database, Redis and the sandbox pool.
          runbook: docs/runbooks/production.md#the-api-is-down

      - alert: RuleMindDecisionsStopped
        expr: |
          sum(rate(rulemind_decisions_total[10m])) == 0
          and sum(rulemind_decisions_total offset 1h) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No decisions served for 10 minutes"
          description: >-
            A decisioning engine that has stopped deciding is an outage even when every health
            check is green — the pods are up and nothing is being answered. The second clause
            requires that traffic existed an hour ago, so this stays quiet on a fresh install
            and in environments that are legitimately idle.
          runbook: docs/runbooks/production.md#decisions-stopped

  - name: rulemind-latency
    rules:
      - alert: RuleMindDecisionLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, source) (rate(rulemind_decision_latency_seconds_bucket[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 decision latency above 250ms on {{ $labels.source }}"
          description: >-
            250ms sits just above the measured capacity knee (p95 212ms at concurrency 16), so
            this means the system is past the point where it scales — not merely busy. Note it
            is deliberately NOT the product's 100ms SLO, which reference hardware cannot hold
            past concurrency ~4; see the calibration table at the top of this file. Split by
            `source`: `api` is the executor path and `api_fast` the serving path — if api_fast
            disappears while api rises, traffic has fallen off the fast path rather than the
            engine getting slower, and those have completely different fixes.
          runbook: docs/runbooks/production.md#latency

      - alert: RuleMindDecisionLatencyCritical
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, source) (rate(rulemind_decision_latency_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "p95 decision latency above 1s on {{ $labels.source }}"
          description: >-
            1s p95 was only ever measured beyond 4x the capacity knee — it means severe
            overload, not a busy afternoon. It is set 10x below the 10s evaluation budget
            deliberately, so it fires long BEFORE callers start seeing 504
            evaluation_budget_exceeded. The usual cause is the sandbox pool: each variable has
            its own timeout, and a saturated pool serialises them.
          runbook: docs/runbooks/production.md#latency

  - name: rulemind-correctness
    rules:
      - alert: RuleMindOutcomeMixShifted
        expr: |
          abs(
            sum(rate(rulemind_decisions_total{outcome="approve"}[30m]))
            / clamp_min(sum(rate(rulemind_decisions_total[30m])), 0.001)
            -
            sum(rate(rulemind_decisions_total{outcome="approve"}[30m] offset 1d))
            / clamp_min(sum(rate(rulemind_decisions_total[30m] offset 1d)), 0.001)
          ) > 0.2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Approval rate moved more than 20 points against the same window yesterday"
          description: >-
            THE ALERT THAT MATTERS MOST FOR THIS PRODUCT, and the one a generic stack does not
            have. Every request can return 200 in 15ms while the engine approves everything it
            should reject — a bureau returning nulls, a variable erroring to None, a policy
            promoted by mistake. Latency and error-rate alerts are all silent for that. This is
            not a precision instrument; it is a tripwire that says "look at what changed".
            Compare against /api/v1/slo/status, which computes the same idea per workspace with
            the tenant's own min/max approval bounds.
          runbook: docs/runbooks/production.md#the-outcome-mix-moved

      - alert: RuleMindBundleSyncFailing
        expr: rate(rulemind_bundle_syncs_total{status!="ok"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "On-device bundle syncs are failing"
          description: >-
            Devices that cannot sync keep deciding OFFLINE against the bundle they already
            have — so this does not show up as errors, it shows up as devices quietly running
            an old policy. Decisions from those devices carry a `bundle_hash`, which is how you
            tell afterwards which ones ran stale.
          runbook: docs/runbooks/production.md#bundle-sync
