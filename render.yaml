# Render Blueprint — the API, its database and its cache, as code.
#
# WHY THIS FILE RATHER THAN THE DASHBOARD. A deployment clicked together in a web UI is not
# reviewable, not reproducible, and not diffable: the next person cannot see that
# RULEMIND_ENV=production is what arms the fail-closed secret gate, or that MODEL_POOL_SIZE=1
# is a memory constraint rather than a preference. Everything below is a decision with a
# reason, and `render.yaml` is where those reasons survive.
#
# Deploy:  Render Dashboard -> New -> Blueprint -> connect this repo.
# Render reads this file, provisions all three resources, and prompts once for the four
# secrets marked `sync: false` (they are deliberately NOT in this file).
#
# ── Why this shape ────────────────────────────────────────────────────────────────────────
#
# The original plan was Supabase (Postgres) + Upstash (Redis) + Koyeb (API). Koyeb's console
# has been decommissioned — it is joining Mistral and offers no way to create a service or even
# an API token — and the Supabase org's free tier is full (2/2 projects, both belonging to a
# different project). Putting all three backend tiers on Render instead means one dashboard,
# one region, and a private network between them rather than three public TLS hops per
# decision. The dashboard stays on Vercel, which is what Vercel is actually good at: it is a
# pure client-side SPA with zero API routes and zero SSR.
#
# ── The free tier's two real constraints ──────────────────────────────────────────────────
#
# 512 MB and 0.1 CPU. That drives three settings below and they are not arbitrary:
#
#   * `--workers 1`, not the Dockerfile's default of 2. Each uvicorn worker is an independent
#     SQLAlchemy pool AND a resident copy of the ML stack (sklearn, lightgbm, numpy). Two of
#     them do not fit in 512 MB, and the second one buys nothing at 0.1 CPU.
#   * SANDBOX_POOL_SIZE=1 / MODEL_POOL_SIZE=1. Every sandbox worker is a spawned process with
#     its own interpreter. The defaults (4 and 2) would be six interpreters in 512 MB.
#   * No `preDeployCommand`. Render only offers it on paid instances, so migrations run in the
#     start command instead — see below.
#
# Free web services sleep after 15 minutes idle and take ~30s to wake. That is a real
# first-request penalty, not a bug; `/health` is static and answers immediately once awake.
services:
  # ── API + scheduler ─────────────────────────────────────────────────────────────────────
  - type: web
    name: rulemind-api
    runtime: docker
    dockerfilePath: ./apps/python-executor/Dockerfile
    # The build context is the REPO ROOT, not apps/python-executor: every COPY in that
    # Dockerfile is written relative to the root (`COPY apps/python-executor/app ./app`), so a
    # context scoped to the service directory fails on the first COPY. docker-compose.yml
    # builds it the same way.
    dockerContext: .
    plan: free
    region: singapore
    # Singapore because the database and key-value store below are in Singapore, and a
    # decision makes several round trips to each. Co-locating them matters far more than
    # proximity to any one user, and this is also the closest Render region to the operator.
    healthCheckPath: /health
    # /health, NOT /ready. Liveness here is deliberately static — no database, no Redis, no
    # I/O. /ready is the one that reports dependencies (and, since this session, whether the
    # sandbox can actually spawn); pointing a restart-triggering probe at it would cycle the
    # service on any database blip. See app/main.py::health.
    autoDeploy: false
    # Off on purpose: this repo's CI is the gate, and a push should not deploy before it has
    # run. Deploy from the dashboard or the deploy hook once CI is green.
    # `dockerCommand`, not `startCommand`: Render rejects a docker-runtime service that carries
    # startCommand ("docker runtime must not have startCommand"). It replaces the image's CMD,
    # which entrypoint.sh then execs (it ends in `exec "$@"`).
    #
    # A script path, not an inline command. The inline form
    #   sh -c "alembic upgrade head && exec uvicorn ..."
    # exited 127 without printing a line: Render splits this value into argv on whitespace
    # rather than handing it to a shell, so the quotes survive as literal characters and
    # `sh -c '"python3'` is not a command. Anything containing `&&` has the same problem.
    # apps/python-executor/render-start.sh carries the logic, and can be run against the real
    # image locally before anyone deploys it.
    dockerCommand: ./render-start.sh
    # Migrations run HERE, which the Dockerfile's entrypoint deliberately does not do. Two
    # things make that safe on this plan and it is worth being explicit about both, because
    # the reasons it was removed from the entrypoint still apply everywhere else:
    #   1. `&&`, not `;` or an `if`. A failed migration stops the boot. The original entrypoint
    #      wrapped it in `if ... else echo WARNING; fi`, which defeats `set -e` — a failed
    #      migration was logged and the API served against a stale schema.
    #   2. The race that motivated moving migrations to a Helm pre-upgrade hook is N replicas
    #      running the chain simultaneously. A free Render service is a single instance with no
    #      horizontal scaling, so there is exactly one runner. Raise the plan and this must
    #      move to a Render pre-deploy command or a one-off job before scaling past one.
    envVars:
      # ── the four the production gate refuses to start without ───────────────────────────
      # app/security_config.py::verify_production_secrets fails closed outside local dev if any
      # of these is unset or still its committed dev default — the defaults are in this repo,
      # so a deploy that forgot one would be running on publicly-known credentials.
      #
      # `generateValue: true`, not `sync: false`. Render generates a random value at create
      # time and stores it encrypted, so these are never typed by anyone, never pass through a
      # terminal or a chat log, and never exist in a file on someone's laptop. Read them back
      # from the dashboard when you need one (RULEMIND_DEV_API_KEY is the tenant API key you
      # will want for calling /decide).
      #
      # Nothing validates the API key's shape — storage._seed_default_api_key hashes whatever it
      # is given — so a generated value works despite not carrying the usual `rm_live_` prefix.
      - key: RULEMIND_CONFIG_KEY
        generateValue: true
      - key: RULEMIND_ADMIN_JWT_SECRET
        generateValue: true
      - key: RULEMIND_ADMIN_PASSWORD
        generateValue: true
      - key: RULEMIND_DEV_API_KEY
        generateValue: true

      # ── what arms that gate in the first place ──────────────────────────────────────────
      # Unset is NOT the same as "development": security_config falls back to NODE_ENV, which
      # defaults to development, so a deployment that simply never sets this skips the whole
      # check and boots on the four publicly-known defaults. Same trap as AUTH_MODE below.
      - key: RULEMIND_ENV
        value: production

      # ── wiring ──────────────────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: rulemind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rulemind-kv
          property: connectionString

      # AUTH_MODE unset leaves auth ON (middleware tests for the literal string "none"), so
      # this is belt and braces rather than a change — but an explicit value is the difference
      # between "we chose this" and "nobody looked".
      - key: AUTH_MODE
        value: apikey

      # Render terminates TLS at its edge and forwards exactly one hop, so the client IP is the
      # last entry in X-Forwarded-For. Getting this wrong means the login lockout and the
      # pre-auth rate limiter key on the proxy instead of the caller — one bucket for the
      # entire internet.
      - key: RULEMIND_TRUSTED_PROXY_HOPS
        value: "1"

      # ── the 512 MB budget (see the header) ───────────────────────────────────────────────
      - key: SANDBOX_POOL_SIZE
        value: "1"
      - key: MODEL_POOL_SIZE
        value: "1"
      # fail, never inline. The fallback runs untrusted customer Python in the API process with
      # no RLIMIT and no process boundary — precisely when the sandbox is already unhealthy.
      # /ready reports `degraded` if this is ever flipped, which is how you would find out.
      - key: SANDBOX_FALLBACK_MODE
        value: fail

      # One instance, so the scheduler runs in-process and there is no separate worker service
      # to pay for. The DB lease still elects a leader, which keeps this correct if it ever
      # scales past one.
      - key: RULEMIND_RUN_API_SCHEDULER
        value: "1"

      # DB_POOL_SIZE * workers must stay under the database's connection limit. One worker at
      # 5+5 is comfortable; the Dockerfile's default of 20+20 x 2 workers would be 80.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # The dashboard's origin. Without this the browser blocks every API call the dashboard
      # makes, which presents as "the API is down" rather than as a CORS policy -- one of the
      # more expensive ways to lose an afternoon.
      #
      # Hardcoded rather than `fromService`, because Render exposes a service's HOST but offers
      # no way to prepend the scheme, and parse_origins needs a full origin. The value is
      # deterministic: the service below is named rulemind-dashboard, so Render assigns
      # rulemind-dashboard.onrender.com. Verify after the first deploy -- Render appends a
      # suffix if a name is already taken globally, and then this needs updating to match.
      #
      # Not a wildcard, deliberately. `allow_credentials=True` is set on the CORS middleware and
      # the member session rides in an httpOnly cookie, so "*" would let any site on the
      # internet make credentialed calls with a logged-in user's session.
      - key: CORS_ORIGINS
        value: https://rulemind-dashboard.onrender.com

      # Demo data OFF. This is a real deployment, and seeding invents policies and decisions
      # that look like production records.
      - key: RULEMIND_SEED_DEMO
        value: ""

  # ── Redis-compatible cache ──────────────────────────────────────────────────────────────
  # Under `services`, not `databases`: Render's schema reserves `databases` for Postgres.
  #
  # Redis is genuinely optional here — the app documents in-process fallbacks for rate limiting
  # and the decision bus, and /ready reports `not_configured` rather than an error without it.
  # It is provisioned because two of those fallbacks are per-PROCESS, which stops being correct
  # the moment there is more than one instance: the login-failure counter in particular resets
  # on every restart and is not shared, so N instances would give an attacker N times the
  # attempts before a lockout. A durable database tier was added underneath it this session, so
  # that is no longer the disaster it was — but Redis is still the fast path.
  - type: keyvalue
    name: rulemind-kv
    plan: free
    region: singapore
    ipAllowList: []
    # Empty = private network only; nothing on the public internet can connect.
    maxmemoryPolicy: noeviction
    # noeviction, NOT allkeys-lru. This holds rate-limit counters and login-failure counters.
    # Evicting a login-failure counter silently resets a lockout, which is the one thing it
    # exists to prevent — better to fail the write and fall back to the database tier than to
    # quietly forget that someone has been guessing.

  # ── dashboard ───────────────────────────────────────────────────────────────────────────
  # A STATIC SITE, not a web service, and that distinction is the whole reason it is here
  # rather than on Vercel.
  #
  # The dashboard is a pure client SPA: 37 pages, zero Next.js API routes, zero dynamic route
  # segments, no middleware, no next/image, no getServerSideProps. It compiles to plain files,
  # so it needs a CDN and nothing else. Render static sites are free, have no instance to pay
  # for, and — unlike the free WEB service tier — do not spin down after 15 minutes, so the
  # dashboard has no cold start even though the API behind it does.
  #
  # Vercel was the original plan and is a fine host, but its GitHub App could not see this
  # private repo and granting it required a GitHub sudo-mode re-auth. Render's GitHub App is
  # already connected to this exact repository (it is deploying the API above), so this costs
  # zero new accounts and zero new permission grants, and it lives in the same file as the rest
  # of the deployment.
  - type: web
    name: rulemind-dashboard
    runtime: static
    region: singapore
    # `corepack enable` first: the repo pins pnpm@9.15.0 in packageManager, and the build needs
    # that exact version to honour pnpm-lock.yaml. NEXT_OUTPUT=export is read by
    # apps/web/next.config.js -- see the comment there for why the export is opt-in rather than
    # the default (it would break `next start`, which docker-compose and the smoke test use).
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @rulemind/web build
    staticPublishPath: apps/web/out
    # No catch-all rewrite to /index.html. A Next.js static export emits a real index.html per
    # route, so a SPA-style catch-all would serve the wrong page for every deep link -- the
    # dashboard is genuinely multi-page, not a single shell doing client-side routing.
    autoDeploy: false
    envVars:
      - key: NEXT_OUTPUT
        value: export
      - key: NODE_VERSION
        value: "20"
      # Inlined at BUILD time by Next -- this is not a secret, it is a public API origin. The
      # runtime override (window.__RULEMIND_CONFIG__) still takes precedence if a deployment
      # ever needs to repoint the bundle without rebuilding; see apps/web/src/lib/store.ts.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://rulemind-api.onrender.com

databases:
  - name: rulemind-db
    databaseName: rulemind
    user: rulemind
    plan: free
    region: singapore
    # Render's free Postgres is deleted after 30 days — it is for validating the deployment,
    # not for holding anything that matters. Move to a paid instance (or back to Supabase, once
    # a slot frees up) before this holds real decisions; the only thing that changes is
    # DATABASE_URL, because the Alembic chain builds the schema from empty either way.
    ipAllowList: []
    # Empty = private network only. The API reaches it over Render's internal network; nothing
    # on the public internet can connect.
