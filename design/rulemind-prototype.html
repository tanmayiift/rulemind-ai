/* ---------------- Router & interactions ---------------- */
function nav(key){
  document.querySelectorAll('#nav a, .nav-foot').forEach(a=>a.classList.toggle('active', a.dataset.nav===key));
  document.getElementById('crumb-page').textContent = titles[key]||key;
  const el = document.getElementById('content');
  el.innerHTML = `<div class="screen">${(screens[key]||(()=>emptyScreen(titles[key]||key,'','')))()}</div>`;
  window.scrollTo(0,0);
  bindDrag();
}
function openDecision(id){
  const d = decisions.find(x=>x.id===id)||decisions[0];
  document.getElementById('dw-id').textContent=id;
  const rc = d.out==='reject'?['AA05 · Debt-to-income too high','AA12 · Insufficient credit history']:d.out==='review'?['MR02 · Manual income verification required']:[];
  document.getElementById('dw-body').innerHTML = `
   <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">${pill(d.out)}<span style="color:var(--muted);font-size:13px">score <b class="tnum" style="color:var(--text)">${d.score??'—'}</b> · ${d.lat}ms · ${d.policy}</span></div>
   <dl class="kv"><dt>Trace ID</dt><dd class="mono">trace_${id.slice(4)}f3</dd><dt>Subject</dt><dd class="mono">CUST-0049213</dd><dt>Experiment</dt><dd>EXP-092 · challenger</dd><dt>Environment</dt><dd>Production</dd></dl>
   <h4 style="font-size:13px;margin-bottom:8px">Explanation tree</h4>
   ${treeNode('AND group','',null)}
   ${treeNode('credit_score ≥ 600','700 ≥ 600',true)}
   ${treeNode('dti_ratio between 0–0.45','0.62 ∉ [0,0.45]',false)}
   ${treeNode('region in [KA,MH,DL]','"MH" ∈ set',true)}
   ${rc.length?`<h4 style="font-size:13px;margin:18px 0 8px">Adverse-action reason codes</h4>${rc.map(r=>`<div class="reason-code"><span class="rc-code">${r.split(' · ')[0]}</span><span style="font-size:12.5px">${r.split(' · ')[1]}</span></div>`).join('')}`:''}`;
  document.getElementById('scrim').classList.add('show');document.getElementById('drawer').classList.add('show');
}
function treeNode(label,cond,pass){const c=pass===null?'neutral':pass?'approve':'reject';const ic=pass===null?'':pass?icon('check'):icon('x');return `<div class="tree-node"><div class="tn-h"><span>${label}</span>${cond?`<span class="tn-cond">${cond} <span class="pill ${c}">${ic}${pass?'pass':'fail'}</span></span>`:'<span class="pill neutral">group</span>'}</div></div>`;}
function closeDrawer(){document.getElementById('scrim').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
function openDialog(){document.getElementById('scrim').classList.add('show');document.getElementById('dialog').classList.add('show');}
function closeDialog(){document.getElementById('dialog').classList.remove('show');if(!document.getElementById('drawer').classList.contains('show'))document.getElementById('scrim').classList.remove('show');}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';clearTimeout(tT);tT=setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(20px)';},2200);}
function bindDrag(){
  const ghost=document.getElementById('ghost'), canvas=document.getElementById('canvas');
  if(!ghost||!canvas)return;
  document.querySelectorAll('.node-chip[draggable]').forEach(chip=>{
    chip.addEventListener('dragstart',()=>{ghost.textContent=chip.textContent.trim();ghost.style.display='block';});
    chip.addEventListener('dragend',()=>{ghost.style.display='none';});
  });
  canvas.addEventListener('dragover',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();ghost.style.left=(e.clientX-r.left-90)+'px';ghost.style.top=(e.clientY-r.top-18)+'px';});
  canvas.addEventListener('drop',e=>{e.preventDefault();ghost.style.display='none';toast('Node added to canvas');});
}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=icon(t==='dark'?'sun':'moon');try{localStorage.setItem('rm-theme',t);}catch(e){}}

/* ---------------- Boot ---------------- */
document.getElementById('root').innerHTML = shell();
document.addEventListener('click', e=>{ const a=e.target.closest('[data-nav]'); if(a){ e.preventDefault(); nav(a.dataset.nav);} });
document.getElementById('scrim').addEventListener('click',()=>{closeDrawer();closeDialog();});
document.getElementById('themeBtn').addEventListener('click',()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeDialog();}});
let _t;try{_t=localStorage.getItem('rm-theme');}catch(e){}
setTheme(_t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
nav('dashboard');
</script>
