name: rulemind_journeys
description: "RuleMind — non-lending decisioning journeys demo (iOS + Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.0
  rulemind:
    path: ../packages/sdk-flutter
  rulemind_ui:
    path: ../packages/flutter-ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
