# NOTE: there used to be a top-level `namespace:` key here. No template ever
# referenced it, so setting it did nothing at all. Namespace is a release
# property, not a chart value — use `helm install -n <ns> --create-namespace`.

# IMAGES. Three ways to get them, and until 2026-09-23 only the third existed:
#
#   1. Publish your own with .github/workflows/release-images.yml (workflow_dispatch, builds
#      and pushes ghcr.io/<owner>/rulemind-{api,web}:<version>). Then set image.*.tag.
#   2. Mirror them into your own registry and override image.*.repository.
#   3. Build locally and load them into the cluster -- scripts/k8s_up.sh does this for kind, and
#      values-kind.yaml overrides repository/tag/pullPolicy accordingly.
#
# The defaults below named `rulemind/api:latest`, which NOTHING in this repository produced and
# which resolves to a non-existent Docker Hub image, so `helm install` against a real cluster
# ImagePullBackOff'd on every pod. That is the single reason "any company can host this on their
# own infra" did not hold.
#
# `tag` defaults to the chart's appVersion rather than `latest` so that a release is
# identifiable and `helm rollback` restores a DIFFERENT binary than the one it is leaving --
# with both sides on :latest it restores the same image and the rollback does nothing.
image:
  web:
    repository: ghcr.io/tanmayiift/rulemind-web
    tag: ""              # defaults to .Chart.AppVersion; set explicitly to pin a release
    pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/tanmayiift/rulemind-api
    tag: ""
    pullPolicy: IfNotPresent
  worker:
    # There is no `rulemind/worker` image and no Dockerfile that would build one.
    # docker-compose.yml builds the worker from apps/python-executor/Dockerfile
    # and just overrides the command (`python3 -m app.worker`), so the worker IS
    # the API image. Defaulting this to the api repository keeps the chart
    # deployable; override only if you genuinely publish a separate image.
    repository: ghcr.io/tanmayiift/rulemind-api
    tag: ""
    pullPolicy: IfNotPresent

replicaCount:
  web: 2
  # api is only honoured when hpa.enabled=false. With the HPA on, the Deployment
  # deliberately omits `replicas` so `helm upgrade` does not stomp the autoscaler's
  # current scale back down to this number on every release.
  api: 3
  worker: 2

service:
  web:
    type: ClusterIP
    port: 3000
  api:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: nginx
  host: rulemind.local
  tlsSecretName: rulemind-tls
  # The browser talks to the API through this same host: `/api` and `/ws` are
  # routed to the API Service (see templates/ingress.yaml). The old chart had a
  # single `/` -> web rule and NO route to the API at all, so the dashboard could
  # not reach the backend from a browser under any configuration.
  apiPath: /api
  wsPath: /ws

# Point at a Secret you provisioned yourself (External Secrets, Sealed Secrets, the CSI
# driver, or `kubectl create secret`) instead of letting this chart create one.
#
# Why this exists: scripts/k8s_up.sh shows the only workflow the chart supported --
#   helm install ... --set-string env.configKey="$CONFIG_KEY" ...
# which puts four production secrets into shell history, into CI logs, and into the Helm
# release Secret stored in the cluster. No security review passes that, so "bring your own
# Secret" was a blocker for exactly the buyers this chart is aimed at.
#
# The Secret must carry the same keys this chart would have written: DATABASE_URL, REDIS_URL,
# RULEMIND_CONFIG_KEY, RULEMIND_ADMIN_JWT_SECRET, RULEMIND_ADMIN_PASSWORD, RULEMIND_DEV_API_KEY.
# When set, templates/secret.yaml is not rendered at all and the env.* values below are ignored.
#
# ONE TRADE-OFF, stated because it is easy to be surprised by: the checksum/secret annotation on
# the Deployments hashes the Secret THIS CHART renders. With existingSecret that template is
# empty, so rotating your external Secret will not roll the pods -- Helm cannot see content it
# does not template. Trigger the rollout yourself (`kubectl rollout restart deploy/rulemind-api
# deploy/rulemind-worker`), or let your secrets operator do it: External Secrets and the CSI
# driver both have a reloader for exactly this.
existingSecret: ""

env:
  databaseUrl: ""          # REQUIRED unless existingSecret is set: postgresql://user:pass@host:5432/dbname
  redisUrl: ""             # REQUIRED: redis://host:6379/0
  configKey: ""            # REQUIRED: Fernet encryption key for config secrets
  adminJwtSecret: ""       # REQUIRED: JWT signing secret for admin sessions
  # Also REQUIRED, and previously absent from this file entirely. rulemindEnv below is
  # `production`, which arms security_config.PRODUCTION_SECRET_CHECKS over four secrets --
  # these two included. Without them the API pod refuses to boot, correctly, on the committed
  # defaults. Set all four or the chart does not run.
  adminPassword: ""        # REQUIRED: initial admin password
  devApiKey: ""            # REQUIRED: seeded tenant's API key (rm_live_...)

  # OPTIONAL, and the chart deliberately does not ship a broker. Same reasoning as the database:
  # a chart that bundles its own Kafka invites someone to run that Kafka in production, where it
  # would have no replication, no retention policy and no operator.
  #
  # Leave this blank and the decision outbox still records every event in Postgres, in the same
  # transaction as the decision -- you lose DELIVERY, never data (app/decision_outbox.py). Set it
  # and the leader-gated relay starts publishing. Point it at whatever broker you already run;
  # `docker compose --profile kafka up -d kafka` is the local equivalent.
  kafkaBootstrapServers: ""   # e.g. kafka.svc.cluster.local:9092

  # SELF-SERVE SIGNUP -- off on a chart install, on in the code's own default.
  #
  # app/routers/onboarding.py:50 reads env_bool("RULEMIND_SELF_SERVE_SIGNUP", True), and
  # app/middleware.py:486 lists /api/v1/onboarding/signup in EXEMPT_PATHS, so it is reachable
  # UNAUTHENTICATED through the Ingress. The variable appeared in no chart or manifest, so every
  # cluster install published a tenant-and-API-key faucet on day one, rate-limited only to
  # 20 req/min/IP. That default is right for `docker compose up` on a laptop and wrong for the
  # deployment shape this chart exists for: an internal install at a company that provisions
  # tenants out of band.
  #
  # Set to "1" if you actually want public signup, and put an authenticating proxy in front.
  selfServeSignup: "0"

  # Performance flags, both previously unreachable -- absent from this chart and from
  # docker-compose.yml, so they could not be turned on anywhere. Off by default, as the code is.
  #
  # COMPUTE_ONLY_USED_VARS shrinks a decision's recorded computed_variables from every PROMOTED
  # variable (plus what the policy reads) to what the policy actually read -- unpromoted drafts
  # no policy uses are never part of a decision either way: a change to your AUDIT SURFACE, so decide it
  # deliberately rather than for the throughput (it is worth the whole measured +82%).
  # This value is the INSTALL-WIDE DEFAULT. Any tenant can override it in either direction with
  # `compute_only_used_vars` in their engine_config (PUT /api/v1/settings) -- including keeping
  # every promoted variable recorded on an install that turned it on for everyone else.
  fastDecide: "0"
  computeOnlyUsedVars: "0"

  # Was set in NO deployment artifact. app/security_config.py checks RULEMIND_ENV
  # first; with it unset (and NODE_ENV unset) the fail-closed default-secret check
  # takes its "warn and SKIP" branch, so a cluster would happily boot on the
  # committed dev keys. "production" makes that check fail closed.
  rulemindEnv: production

  # Number of proxy hops you control in front of the API. MUST be non-zero behind an ingress.
  # The pre-auth abuse budgets (signup, admin surface, login) are keyed by client IP, and with
  # 0 hops the client IP is the socket peer -- which behind an ingress is the INGRESS. Every
  # budget then shares one bucket, so a busy cluster 429s legitimate signups while an attacker
  # coming through the same ingress is indistinguishable from everyone else. 1 is correct for a
  # single ingress controller; add one per additional proxy you actually operate.
  trustedProxyHops: 1

  # Never rendered by the old chart, so a helm deploy silently fell back to the
  # app default in app/main.py:43 ("http://localhost:3000,http://127.0.0.1:3000")
  # and every browser call from the real host was blocked by CORS. Empty here =
  # derive from ingress.host (both schemes); set explicitly to override.
  corsOrigins: ""

  # Public base URL the browser should use for API calls. "" means same-origin
  # relative URLs (/api/v1/...), which the ingress routes to the API Service —
  # the correct value for the standard single-host deployment.
  #
  # CAVEAT: apps/web/src/lib/store.ts reads process.env.NEXT_PUBLIC_API_BASE_URL,
  # which Next.js INLINES at build time, so this runtime env var is a no-op until
  # store.ts is changed to read the API base at runtime. Until then the value must
  # be baked with `docker build --build-arg NEXT_PUBLIC_API_BASE_URL=`.
  webApiBaseUrl: ""

# ---------------------------------------------------------------------------
# Connection-pool arithmetic. RE-DERIVE THIS IF YOU CHANGE ANY NUMBER BELOW.
#
# Every uvicorn worker process builds its own SQLAlchemy pool, so the connection
# count multiplies three ways: pods x uvicorn workers x (pool_size + max_overflow).
#
# What it used to be:
#   app/db.py defaults DB_POOL_SIZE=20, DB_MAX_OVERFLOW=20  -> 40 per process
#   Dockerfile CMD ran uvicorn --workers 4                  -> 160 per API pod
#   replicaCount.api: 3                                     -> 480 at rest
#   hpa.maxReplicas: 20                                     -> 3200 at full scale
# against a Postgres whose out-of-the-box max_connections is 100. The API would
# exhaust the server long before the HPA ever reached its ceiling.
#
# What it is now, against a REQUIRED Postgres max_connections = 300:
#   reserved for superuser / psql / monitoring ..............  15
#   pre-upgrade migration Job (runs alone, brief) ...........   5
#   worker: 2 replicas x 1 process x (5 + 5) ................  20
#   api:   12 pods (hpa.maxReplicas) x 2 uvicorn workers
#          x (DB_POOL_SIZE 5 + DB_MAX_OVERFLOW 5 = 10) ...... 240
#                                                            ----
#   worst-case total ........................................ 280  <= 300  OK
#
# Levers, in the order you should reach for them:
#   1. raise Postgres max_connections (or put PgBouncer in front, which is the
#      real answer above ~12 API pods),
#   2. lower hpa.maxReplicas,
#   3. lower db.poolSize / db.maxOverflow.
# Do NOT raise api.uvicornWorkers without redoing the sum above.
# ---------------------------------------------------------------------------
# ════════════════════════════════════════════════════════════════════════════════════════════
# config — THE CONFIGURATION INTERFACE
# ════════════════════════════════════════════════════════════════════════════════════════════
#
# Measured, not asserted (scripts/config_surface.py, 2026-09-24): the backend reads 111
# environment variables. Before this block, docker-compose.yml, this chart and k8s/ together
# could deliver 27 of them. **84 were settable by nothing** -- 68 of those documented in
# .env.example, so an operator could read about a setting, and could not set it.
#
# That is not untidiness. Among the 84: DECISION_ENCRYPT_AT_REST and AUDIT_ENCRYPT_AT_REST
# (encryption at rest could not be turned on), LOG_LEVEL (verbosity could not be raised during
# an incident), RATE_LIMIT_* and CIRCUIT_BREAKER (untunable), SANDBOX_MODE and
# SANDBOX_FALLBACK_MODE (the posture for running untrusted customer Python), and
# RULEMIND_SIGNING_PRIVATE_KEY (without which bundle signing breaks above one replica).
#
# Entries here are set by their REAL environment-variable name and rendered verbatim into the
# ConfigMap, so a setting the code reads can never again be undeliverable. The `env:` block
# above keeps the settings this chart is opinionated about; this block is everything else.
#
# Values MUST be quoted strings -- a ConfigMap's data is string-typed, and an unquoted `1` or
# `true` renders as a YAML bool that Kubernetes rejects.
#
# SECRETS GO IN `secretConfig` BELOW, not here: a ConfigMap is readable by anything with `get`
# on the namespace and `kubectl describe` prints it verbatim.
#
# Every commented line shows the IN-CODE default, so uncommenting changes nothing until you
# edit the value. `scripts/check_config_surface.py` fails the build if a setting the backend
# reads is missing from this file.
config:

  # libpq GSSAPI encryption. Unset = RuleMind disables it (gssencmode=disable) on every connect;
  # set only if your Postgres uses Kerberos. A `gssencmode=` in DATABASE_URL also overrides.
  # PGGSSENCMODE: ""

  # ── Data protection ──────────────────────────────────────────────────────────────────────
  # Set explicitly rather than inherited, because "on by default" is not something a compliance
  # reviewer can read off a cluster. Both encrypt with RULEMIND_CONFIG_KEY (Fernet).
  DECISION_ENCRYPT_AT_REST: "1"    # decision payloads + computed variables at rest
  AUDIT_ENCRYPT_AT_REST: "1"       # audit event payloads at rest
  # RULEMIND_PII_REDACT_KEYS: ""       # extra payload keys to redact from logs and traces
  # RULEMIND_PII_KEY_MATCH: ""         # regex; keys matching it are redacted
  # RULEMIND_PII_VALUE_SCAN: ""        # "1" also scans VALUES for PII patterns (costs latency)

  # ── The sandbox that runs customer Python ────────────────────────────────────────────────
  # SANDBOX_FALLBACK_MODE is the one to read twice. "fail" refuses to evaluate a variable when
  # no sandbox subprocess is available; "inline" runs untrusted customer code INSIDE the API
  # process instead. The code default is "fail" and this chart pins it, because a fallback that
  # silently downgrades the isolation boundary under load is worse than an error.
  SANDBOX_MODE: "pool"             # pool | subprocess | inline
  SANDBOX_FALLBACK_MODE: "fail"    # fail | inline  -- see above before changing
  SANDBOX_POOL_SIZE: "4"           # subprocesses per uvicorn worker; see the budget below
  # SANDBOX_MEMORY_MB: ""              # RLIMIT_AS per sandbox subprocess; unset = no limit
  # SANDBOX_CODE_CACHE_SIZE: "2048"    # compiled-variable cache entries per subprocess
  # SANDBOX_BATCH: "1"                 # a decision's variables in ONE sandbox round trip (measured
  #                                    # 12.6 -> 6.8 ms p50 per decision); "0" = one trip per variable

  # ── Authentication and abuse budgets ─────────────────────────────────────────────────────
  # AUTH_MODE unset is NOT the same as "none": middleware.py tests `== "none"` exactly, so
  # leaving it out leaves auth ON. That is the safe direction, and it is stated here because
  # the README implied otherwise for a long time.
  # AUTH_MODE: ""                      # "none" DISABLES authentication entirely. Dev only.
  # RULEMIND_LOGIN_MAX_ATTEMPTS: ""    # failed logins before lockout
  # RULEMIND_LOGIN_LOCKOUT_SECONDS: ""
  # RULEMIND_LOGIN_ALERT_AFTER: ""     # failed logins before an audit alert
  # RULEMIND_LOGIN_RATE_LIMIT_PER_MIN: ""
  # RULEMIND_ADMIN_RATE_LIMIT_PER_MIN: ""
  # RULEMIND_SIGNUP_RATE_LIMIT_PER_MIN: ""

  # ── Rate limiting ────────────────────────────────────────────────────────────────────────
  # Redis-backed when REDIS_URL is set, per-worker in-process otherwise -- which multiplies the
  # configured limit by the worker count. RATE_LIMIT_FAIL_OPEN decides what happens when Redis
  # is unreachable: unset means fail CLOSED (requests are rejected), which is the safe default
  # and the surprising one, so set it deliberately if availability matters more than the limit.
  RATE_LIMIT_ENABLED: "1"
  # RATE_LIMIT_PER_CLASS: "1"          # separate budgets per endpoint class
  # RATE_LIMIT_AGGREGATE: "1"          # also enforce a tenant-wide aggregate
  # RATE_LIMIT_EXEMPT_PATHS: ""        # comma-separated path prefixes
  # RATE_LIMIT_FAIL_OPEN: ""           # "1" = allow when Redis is down. Read the note above.

  # ── Connector egress (SSRF boundary) ─────────────────────────────────────────────────────
  # RULEMIND_ACTION_ALLOWED_HOSTS is the allow-list for outbound action/webhook targets. Empty
  # means "no host allow-list" -- the SSRF pin (private-range refusal) still applies.
  # RULEMIND_ACTION_ALLOWED_HOSTS: ""
  # RULEMIND_ACTION_MAX_TIMEOUT_MS: "30000"
  # RULEMIND_ACTION_MAX_RETRIES: "5"
  # RULEMIND_ACTION_MAX_POLLS: "10"
  # RULEMIND_ACTION_MAX_POLL_INTERVAL_MS: "10000"
  # RULEMIND_CONNECTOR_MAX_CACHE_TTL_MS: "300000"
  # RULEMIND_CONNECTOR_FETCH_MAX_TIMEOUT_MS: "8000"
  # RULEMIND_CONNECTOR_FETCH_MAX_RETRIES: "2"
  # RULEMIND_CONNECTOR_FETCH_MAX_BODY_BYTES: "1048576"
  # RULEMIND_CONNECTOR_FETCH_CACHE_ENTRIES: "512"

  # ── Circuit breaker ──────────────────────────────────────────────────────────────────────
  CIRCUIT_BREAKER: "1"             # trip connector calls open after repeated failure

  # ── Observability ────────────────────────────────────────────────────────────────────────
  # Set explicitly so raising verbosity during an incident is a `helm upgrade --set`, not a
  # rebuild. It was previously deliverable by nothing at all.
  LOG_LEVEL: "INFO"                # DEBUG | INFO | WARNING | ERROR
  LOG_FORMAT: "json"               # json | text

  # ── Decision write path ──────────────────────────────────────────────────────────────────
  # ASYNC_DECISION_LOG defaults to ON: the decision row is written by a background worker, so a
  # SIGTERM can drop what is still queued. Set "0" for synchronous, zero-loss writes at the
  # cost of write latency on /decide. It could not be forced off from any artifact before this.
  # ASYNC_DECISION_LOG: "1"
  # DECISION_LOG_WORKERS: "4"
  # DECISION_LOG_MAX_QUEUE: "1000"
  # DECISION_READ_AFTER_WRITE_MS: "500"  # how long a read waits for a just-queued write
  # DECISION_WAL: "false"              # write-ahead log for decisions; survives a crash
  # DECISION_WAL_DIR: ""               # must be a writable mount if DECISION_WAL is on
  # DECISION_WAL_COMPACT_EVERY: "1000"
  # DECISION_WAL_MAX_REPLAY_ATTEMPTS: "5"

  # ── Kafka delivery (only when env.kafkaBootstrapServers is set) ──────────────────────────
  # RULEMIND_KAFKA_TOPIC: ""
  # RULEMIND_KAFKA_DLQ_TOPIC: ""
  # RULEMIND_KAFKA_GROUP: ""
  # RULEMIND_KAFKA_CLIENT_ID: "rulemind-relay"
  # DECISION_OUTBOX_RELAY_SECONDS: "5"
  # OUTBOX_RETRY_SECONDS: "60"

  # ── Models and evaluation ────────────────────────────────────────────────────────────────
  # MODEL_POOL_SIZE processes are forked PER UVICORN WORKER. See the process budget below.
  MODEL_POOL_SIZE: "2"
  # MODEL_TIMEOUT_MS: "5000"
  # Batch scoring for model evaluations: one worker call per 2,000 rows.
  # MODEL_BATCH_TIMEOUT_MS: "60000"
  # "0" refuses pickled models at upload and scoring -- the only format whose load runs code.
  # ONNX, PMML, XGBoost JSON and LightGBM files are unaffected. Existing pickles stop scoring.
  # MODEL_ALLOW_PICKLE: "1"
  # SIM_MAX_WORKERS: "32"
  # SIMULATION_JSONL_MAX: "50000"
  # REPORT_MAX_ROWS: "100000"
  # ANALYTICS_WINDOW_DAYS: "90"
  # EXPERIMENT_AUTO_ROLLBACK: "false"
  # EXPERIMENT_AUTO_ROLLBACK_MINUTES: "10"

  # ── Caches ───────────────────────────────────────────────────────────────────────────────
  # FAST_CACHE_* govern the serving-bundle cache used by FAST_DECIDE (env.fastDecide above).
  # FAST_CACHE_TTL_SECONDS: "5.0"
  # FAST_CACHE_EPOCH_TTL: "1.0"
  # FAST_CACHE_MAX_ENTRIES: "2048"
  # RUNTIME_CACHE_MAX_ENTRIES: "4096"
  # API_KEY_CACHE_TTL: "300.0"
  # OAuth2 access tokens (POST /api/v1/oauth/token). Clamped to 60..86400 seconds; a token
  # stops working when its key is revoked, within API_KEY_CACHE_TTL.
  # OAUTH2_ACCESS_TOKEN_TTL_SECONDS: "3600"
  # Where this install runs, as stated to a regulator. Reported by GET /api/v1/data-residency.
  # RULEMIND_DATA_REGION: ""
  # Decision archive sink details (DECISION_ARCHIVE_SINK selects the sink).
  # DECISION_ARCHIVE_S3_BUCKET: ""
  # DECISION_ARCHIVE_S3_PREFIX: "rulemind/decisions"
  # DECISION_ARCHIVE_S3_FORMAT: "jsonl"
  # DECISION_ARCHIVE_S3_ENDPOINT: ""
  # DECISION_ARCHIVE_S3_REGION: ""
  # AWS_REGION: ""
  # CLICKHOUSE_HOST: "localhost"
  # CLICKHOUSE_PORT: "8123"
  # CLICKHOUSE_USER: "default"
  # CLICKHOUSE_DATABASE: "default"
  # CLICKHOUSE_TABLE: "rulemind_decisions"
  # CLICKHOUSE_PREDICTOR_TABLE: "rulemind_predictor_values"
  # Mutual TLS for the SDK surface, terminated at your ingress/proxy.
  # MTLS_MODE: "off"
  # MTLS_CERT_HEADER: "x-client-cert"
  # MTLS_VERIFY_HEADER: "x-client-verify"
  # MTLS_REQUIRE_PROXY_VERIFY: "0"
  # MTLS_ALLOWED_FINGERPRINTS: ""
  # MTLS_PROTECTED_PREFIXES: "/sdk/v1"
  # Enforce per-plan monthly decision quotas.
  # QUOTA_ENFORCE: "0"
  # Development only. The chart sets RULEMIND_ENV=production, which is what arms the check.
  # NODE_ENV: "production"
  # Escape hatches for the production secret check -- never on a real deployment.
  # RULEMIND_ALLOW_DEFAULT_SECRETS: ""
  # RULEMIND_SKIP_SECRET_CHECK: "0"

  # ── Redis client behaviour ───────────────────────────────────────────────────────────────
  # REDIS_SOCKET_TIMEOUT: ""
  # REDIS_CONNECT_TIMEOUT: ""
  # REDIS_HEALTH_CHECK_INTERVAL: ""
  # REDIS_RETRY_AFTER_SECONDS: "30.0"

  # ── Outbound webhook delivery ────────────────────────────────────────────────────────────
  # Durable: an event is recorded before it is sent, retried with backoff for ~9 hours, then
  # dead-lettered where it can be listed and replayed. At-least-once; receivers dedupe on the
  # delivery id.
  # WEBHOOK_MAX_ATTEMPTS: "8"
  # WEBHOOK_CLAIM_TIMEOUT_SECONDS: "300"   # reclaim a delivery whose process died mid-send
  # WEBHOOK_DRAIN_SECONDS: "15"
  # WEBHOOK_DRAIN_BATCH: "100"

  # ── Stuck-execution sweep ────────────────────────────────────────────────────────────────
  # Paused executions that nothing will resume. Reports (an error event naming the count and
  # the oldest); does NOT expire unless you ask, because a paused execution holds a real
  # decision in flight and abandoning a live case is worse than leaving a stale row.
  # EXECUTION_SWEEP_AFTER_MINUTES: "1440"
  # EXECUTION_SWEEP_INTERVAL_MINUTES: "60"
  # EXECUTION_SWEEP_EXPIRE: "0"     # "1" also marks them expired

  # ── Background scheduler ─────────────────────────────────────────────────────────────────
  # Leader-elected by a Postgres advisory lease, so these apply cluster-wide, not per pod.
  # RULEMIND_RUN_API_SCHEDULER: ""     # "1" runs the scheduler in the API pod instead of worker
  # SCHEDULER_LEASE_TTL: "30"
  # SLO_CHECK_INTERVAL_MINUTES: "15"
  # SAML_PRUNE_INTERVAL_HOURS: "6"

  # ── SDK and bundles ──────────────────────────────────────────────────────────────────────
  # SDK_BUNDLE_REQUIRE_CLIENT_KEY: ""  # "1" requires a per-device key to fetch a bundle
  # SDK_DECISIONS_BATCH_MAX: "1000"
  # RULEMIND_BUNDLE_PATH: ""           # lambda_handler only: a bundle baked into the image

  # ── Streaming and misc ───────────────────────────────────────────────────────────────────
  # DECISION_STREAM_BACKLOG: "25"
  # DECISION_STREAM_POLL_SECONDS: "1.0"
  # DECISION_STREAM_MAX_SECONDS: "3600"
  # RULEMIND_WEBHOOK_MAX_SUBSCRIPTIONS: "50"
  # RULEMIND_ENABLE_DOCS: "false"      # serve /docs and /openapi.json even in production
  # RULEMIND_PUBLIC_API_BASE_URL: ""   # absolute base URL advertised to SDKs
  # RULEMIND_ADMIN_EMAIL: "admin@rulemind.local"
  # ANTHROPIC_WORKSPACE_ID: ""         # optional workspace scope for the BYO-key AI features

# Secret-VALUED settings. Rendered into the Secret, not the ConfigMap. Same naming rule: real
# environment-variable names.
#
# RULEMIND_SIGNING_PRIVATE_KEY is the one that matters and appeared in no artifact at all.
# Unset, app/compiler.py generates a fresh RSA key PER PROCESS, so with replicaCount.api > 1 an
# SDK that fetches /sdk/v1/signing-key from one pod and /sdk/v1/bundle from another fails
# signature verification -- and every restart invalidates a key a device has pinned.
# Generate: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
secretConfig: {}
  # CLICKHOUSE_PASSWORD: ""           # when DECISION_ARCHIVE_SINK=clickhouse
  # RULEMIND_SIGNING_PRIVATE_KEY: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----

db:
  maxConnections: 300      # documentation only: what the chart assumes of Postgres
  poolSize: 5              # DB_POOL_SIZE   (per uvicorn worker process)
  maxOverflow: 5           # DB_MAX_OVERFLOW
  poolRecycle: 1800
  poolTimeout: 30

api:
  # uvicorn --workers. Was 4; each one is a separate pool (see the sum above) and
  # a separate copy of the ML stack in RAM.
  uvicornWorkers: 2

# ---------------------------------------------------------------------------
# PROCESS AND MEMORY BUDGET — the arithmetic, the way db.* above states the
# connection budget. These were set independently of each other and did not add up.
#
# A pod does not run `uvicornWorkers` processes. Each uvicorn worker forks its OWN
# sandbox pool and its OWN model pool:
#
#   1 uvicorn master
#   + uvicornWorkers x (1 worker + SANDBOX_POOL_SIZE + MODEL_POOL_SIZE)
#   = 1 + 2 x (1 + 4 + 2) = 15 processes at the defaults
#
# Both pool sizes live in `config:` above. They were settable by NO artifact before
# 2026-09-24, so an operator could grant the pod more CPU and had no way to let it use it.
#
# MEASURED on 2026-09-24, inside the running api container (/proc/<pid>/statm):
#
#   uvicorn worker, ML stack resident .......... 118 MB each   (x2 = 236 MB)
#   sandbox subprocess ......................... 27 MB each    (x8 = 216 MB)
#   model worker (imports the same ML stack) ... ~120 MB each  (x4 = 480 MB)
#   uvicorn master + multiprocessing tracker ... 41 MB
#                                               ---------
#   full-pool floor ............................ ~975 MB, before a single request's
#                                                working set
#
# The pools fill LAZILY, which is why an idle pod reads ~285 MB and this was never
# noticed. requests.memory was 1Gi -- i.e. BELOW the pod's own full-pool floor, so the
# scheduler could pack a node on the idle number and OOMKill it as the pools filled.
# It is 1.5Gi now, and the limit 3Gi rather than 2Gi.
#
# CPU: requests.cpu was 500m for those 15 processes, with limits.cpu 2. That is a 4x
# burst ratio, and hpa.cpuUtilization is a percentage of the REQUEST -- so at 70% the
# HPA added replicas at 350m while each pod was permitted 2000m. Pods scaled out at
# ~17% of their own ceiling. requests.cpu is 1 now, so the HPA acts at 700m of 2000m.
#
# Note on MODEL_MEMORY_MB (2048, compose only): it is an RLIMIT_AS -- an ADDRESS SPACE
# cap, not an RSS budget -- so it does not sum against the pod's memory limit and the
# "4 x 2048 = 8 GB against a 2 Gi pod" reading is wrong. It is also inert as a
# protection, because the cgroup limit is reached first. Left as-is deliberately: the
# floor exists because numpy/scipy/sklearn reserve large virtual regions just to import.
#
# Raise uvicornWorkers and you multiply BOTH pools and the DB connection sum above.
# ---------------------------------------------------------------------------

# Empty maps here meant no requests and no limits. A CPU-utilization HPA computes
# against resources.requests.cpu, so with none set the HPA reported <unknown> for
# the metric and never scaled at all; nothing capped memory either, so one runaway
# policy evaluation could take the node down.
resources:
  api:
    requests:
      # See the PROCESS AND MEMORY BUDGET block above before changing either of these.
      # cpu was 500m against 15 processes, and the HPA targets a percentage of THIS number.
      cpu: "1"
      # memory was 1Gi, which is below the measured ~975 MB full-pool floor. xgboost,
      # lightgbm, sklearn and scipy are resident per uvicorn worker AND per model worker.
      # (An earlier comment here also listed pandas; pandas is not in the image.)
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 3Gi
  web:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  worker:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

securityContext:
  runAsUser: 10001         # matches `useradd -r -u 10001 rulemind` in both Dockerfiles
  runAsGroup: 10001
  fsGroup: 10001
  # readOnlyRootFilesystem is OFF by default and this is a deliberate, checked
  # decision, not an oversight. What writes to the filesystem today:
  #   - app/worker.py writes /tmp/rulemind-worker.ready  (covered: emptyDir on /tmp)
  #   - app/decision_wal.py writes $CWD/data/wal when DECISION_WAL=1
  #                                                    (covered: emptyDir on /app/data)
  #   - Next.js writes .next/cache at runtime           (web: NOT covered)
  # The two API/worker writers are already backed by emptyDir mounts, so flipping
  # this to true for api+worker should work; it is left off because the ML stack
  # (xgboost / lightgbm / numba) also writes caches under $HOME on some paths and
  # that has not been exercised here. Turn it on in a staging cluster first.
  readOnlyRootFilesystem: false

# Spread API replicas across nodes. replicaCount.api: 3 with no anti-affinity lets all three
# land on one node, so a node loss is a full outage while the replica count says otherwise.
# "ScheduleAnyway" is best-effort and safe on a single-node cluster; switch to "DoNotSchedule"
# on a real multi-node cluster to make it a hard requirement.
spreadAcrossNodes: true
spreadPolicy: ScheduleAnyway

hpa:
  enabled: true
  minReplicas: 3
  # Was 20. Capped at 12 by the connection budget above — going higher needs a
  # bigger max_connections or PgBouncer, not just a bigger number here.
  maxReplicas: 12
  cpuUtilization: 70

pdb:
  minAvailable: 2

migrations:
  # The image entrypoint no longer runs `alembic upgrade head` (it swallowed
  # failures and every replica raced it). Migrations now run exactly once, in a
  # pre-install/pre-upgrade Helm hook Job.
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
