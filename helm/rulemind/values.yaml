namespace: default

image:
  web:
    repository: rulemind/web
    tag: latest
    pullPolicy: IfNotPresent
  api:
    repository: rulemind/api
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: rulemind/worker
    tag: latest
    pullPolicy: IfNotPresent

replicaCount:
  web: 2
  api: 3
  worker: 2

service:
  web:
    type: ClusterIP
    port: 3000
  api:
    type: ClusterIP
    port: 8080

ingress:
  enabled: true
  className: nginx
  host: rulemind.local
  tlsSecretName: rulemind-tls

env:
  databaseUrl: ""          # REQUIRED: postgresql://user:pass@host:5432/dbname
  redisUrl: ""             # REQUIRED: redis://host:6379/0
  configKey: ""            # REQUIRED: Fernet encryption key for config secrets
  adminJwtSecret: ""       # REQUIRED: JWT signing secret for admin sessions

resources:
  api: {}
  web: {}
  worker: {}

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  cpuUtilization: 70

pdb:
  minAvailable: 2
