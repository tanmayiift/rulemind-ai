apiVersion: batch/v1
kind: Job
metadata:
  name: rulemind-migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rulemind-config
            - secretRef:
                name: rulemind-secrets
