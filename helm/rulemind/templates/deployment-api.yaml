apiVersion: apps/v1
kind: Deployment
metadata:
  name: rulemind-api
spec:
{{- if not .Values.hpa.enabled }}
  # Only pinned when the HPA is off. Rendering `replicas` while an HPA owns this
  # Deployment makes every `helm upgrade` reset the scale to replicaCount.api,
  # after which the HPA scales back up — a pointless scale-down/scale-up on every
  # release, mid-traffic.
  replicas: {{ .Values.replicaCount.api }}
{{- end }}
  selector:
    matchLabels:
      app: rulemind-api
  template:
    metadata:
      annotations:
        # Roll the pods when the ConfigMap or Secret changes. Without these two lines a
        # rotation does NOTHING: secret.yaml and configmap.yaml are pre-upgrade hooks consumed
        # via envFrom, so changing env.configKey leaves this pod template byte-identical, Helm
        # sees no diff, performs no rollout, and the running pods keep the old key indefinitely.
        # Rotation that silently succeeds is worse than rotation that fails.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # This chart ships no ServiceMonitor and the cluster may not run the Prometheus
        # Operator, so these annotations are the portable way to actually get scraped --
        # today nothing scrapes this service at all. /metrics is aggregated across uvicorn
        # workers via PROMETHEUS_MULTIPROC_DIR (see configmap.yaml); without that a scrape
        # returns whichever worker answered it and rate() is meaningless.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app: rulemind-api
    spec:
      {{- include "rulemind.podSecurityContext" . | nindent 6 }}
      {{- if .Values.spreadAcrossNodes }}
      # replicaCount.api is 3 and hpa.minReplicas is 3, which READS like high availability and
      # was not: with no anti-affinity of any kind, Kubernetes is free to place all three on one
      # node, and losing that node is a full outage. The replica count is the number people
      # check; this is the constraint that makes it mean something.
      #
      # ScheduleAnyway, not DoNotSchedule: on a single-node cluster (kind, minikube, a one-node
      # evaluation) DoNotSchedule leaves pods Pending forever, which turns a resilience setting
      # into a reason the chart does not start. Best-effort spreading is the right default;
      # set it to DoNotSchedule on a real multi-node cluster where you want it enforced.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.spreadPolicy | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              app: rulemind-api
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- include "rulemind.containerSecurityContext" . | nindent 10 }}
          args:
            - python3
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --workers
            - {{ .Values.api.uvicornWorkers | quote }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rulemind-config
            - secretRef:
                name: {{ .Values.existingSecret | default "rulemind-secrets" }}
          # Boot does a lot before it can serve: import the ML stack (xgboost,
          # lightgbm, sklearn, pandas), create_all, take the advisory lock, seed,
          # and bcrypt the admin password. startupProbe gives that up to
          # 30 x 5s = 150s while holding liveness off, so a slow cold start is not
          # mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # LIVENESS MUST NOT CHECK DEPENDENCIES. /health is the static endpoint;
          # /ready is the one that talks to Postgres and Redis. Pointing liveness
          # at the dependency check meant a 30s database failover restarted every
          # API pod simultaneously — turning a recoverable blip into an outage,
          # and then a thundering herd of cold starts against the recovering DB.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Readiness keeps the dependency check: a pod that cannot reach Postgres
          # should leave the Service endpoints, but must NOT be killed.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
{{ toYaml .Values.resources.api | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        # Present unconditionally so securityContext.readOnlyRootFilesystem can be
        # flipped to true without also having to remember these. /app/data is where
        # decision_wal.py writes when DECISION_WAL=1.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
