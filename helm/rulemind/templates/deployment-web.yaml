apiVersion: apps/v1
kind: Deployment
metadata:
  name: rulemind-web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app: rulemind-web
  template:
    metadata:
      labels:
        app: rulemind-web
    spec:
      {{- include "rulemind.podSecurityContext" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          {{- include "rulemind.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: 3000
          env:
            # STILL A NO-OP AT RUNTIME, and that no longer matters. Next.js substitutes
            # NEXT_PUBLIC_* constants at BUILD time, so nothing set here reaches the browser
            # bundle; it is rendered because it documents intent and becomes live if the app
            # ever grows a real runtime-config injection (store.ts already reads
            # window.__RULEMIND_CONFIG__ if something sets it).
            #
            # What changed 2026-09-23: apps/web/src/lib/store.ts now falls back to the SERVING
            # ORIGIN whenever the browser is not on localhost, and apps/web/Dockerfile's ARG
            # defaults to empty instead of http://localhost:8080. So a published image needs no
            # build argument and no rebuild -- the dashboard calls its own host and the Ingress
            # routes /api to the API Service.
            #
            # Set this (and rebuild with --build-arg) only for a SPLIT-ORIGIN deployment where
            # the API is on a different host from the dashboard; then set CORS_ORIGINS to match.
            #
            # The value here was once "http://rulemind-api:8080": cluster-internal DNS that no
            # browser can resolve.
            - name: NEXT_PUBLIC_API_BASE_URL
              value: {{ .Values.env.webApiBaseUrl | quote }}
            - name: NODE_ENV
              value: production
            - name: RULEMIND_ENV
              value: {{ .Values.env.rulemindEnv | quote }}
          # The web container had no probes at all: a wedged Next.js server stayed
          # in the Service endpoints forever and was never restarted.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.resources.web | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /workspace/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        # `next start` writes its incremental cache here at runtime, so this mount
        # is what a read-only root filesystem would need.
        - name: next-cache
          emptyDir: {}
