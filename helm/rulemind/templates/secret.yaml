{{- /* Not rendered when .Values.existingSecret names a Secret you provisioned yourself. */ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: rulemind-secrets
  annotations:
    # A HOOK, and it has to be, because templates/job-migrate.yaml is one.
    #
    # Helm applies hooks BEFORE the regular manifests of a release. The migrate Job is a
    # pre-install/pre-upgrade hook that does `envFrom: configMapRef: rulemind-config`, so on a
    # fresh install it started, looked for this ConfigMap, and got
    # `Error: configmap "rulemind-config" not found` -- 26 times, CreateContainerConfigError,
    # until the install timed out. The chart was un-installable from empty.
    #
    # `helm lint` and scripts/verify_chart.py both passed the whole time: the YAML is valid and
    # the rendered contract holds. Only ORDERING was wrong, and ordering does not exist until
    # something applies the manifests. Found by installing the chart on a local kind cluster.
    #
    # hook-weight -10 sorts this ahead of the Job's -5 (lower runs first). The delete policy is
    # before-hook-creation, NOT hook-succeeded: the Deployments reference this same object after
    # the hooks finish, so deleting it on success would take the API's configuration with it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # DATABASE_URL moved here from the ConfigMap: the connection string embeds the
  # database password, and k8s/rulemind.yaml already treated it as a Secret. The
  # two artifacts now agree.
  #
  # These are intentionally NOT wrapped in `required` — the chart must still
  # render for `helm template`/diff review without a secret store attached. The
  # real gate is app-side and now actually armed: with RULEMIND_ENV=production
  # (see configmap.yaml) app/security_config.py refuses to start on an unset or
  # default secret, which also catches the case `required` cannot — an operator
  # who pasted the committed dev value.
  # Each rendered ONLY when set. Omitting beats rendering "" for the same reason as REDIS_URL,
  # and here it is sharper: a blank RULEMIND_CONFIG_KEY derives the Fernet key from sha256(""),
  # which anyone can compute, and a blank DATABASE_URL makes create_engine("") raise at import --
  # CrashLoopBackOff with no useful log. Leaving the key out lets the app's own startup check
  # name the missing variable instead of failing on a value that looks present.
  {{- if .Values.env.databaseUrl }}
  DATABASE_URL: {{ .Values.env.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.env.configKey }}
  RULEMIND_CONFIG_KEY: {{ .Values.env.configKey | quote }}
  {{- end }}
  {{- if .Values.env.adminJwtSecret }}
  RULEMIND_ADMIN_JWT_SECRET: {{ .Values.env.adminJwtSecret | quote }}
  {{- end }}
  # These two were MISSING, and the omission made the chart un-installable as shipped.
  # configmap.yaml sets RULEMIND_ENV=production, which arms app/security_config.py's
  # PRODUCTION_SECRET_CHECKS -- a fail-closed gate over FOUR secrets. The chart supplied values
  # for two of them, so the API pod raised InsecureProductionConfigError on the other two and
  # CrashLoopBackOff'd. Nothing caught it because `helm lint` and verify_chart.py both check the
  # rendered YAML, and the YAML was always valid; the failure only exists once a pod runs.
  # Found by actually installing the chart on a local kind cluster (scripts/k8s_up.sh).
  {{- if .Values.env.adminPassword }}
  RULEMIND_ADMIN_PASSWORD: {{ .Values.env.adminPassword | quote }}
  {{- end }}
  {{- if .Values.env.devApiKey }}
  RULEMIND_DEV_API_KEY: {{ .Values.env.devApiKey | quote }}
  {{- end }}

  # ── Secret-valued settings ────────────────────────────────────────────────────────────────
  # The counterpart to `config:` in configmap.yaml, for settings whose VALUE is a secret.
  # Set by real environment-variable name:
  #
  #   secretConfig:
  #     RULEMIND_SIGNING_PRIVATE_KEY: |
  #       -----BEGIN PRIVATE KEY-----
  #       ...
  #
  # RULEMIND_SIGNING_PRIVATE_KEY is the one that matters today and appeared in NO artifact.
  # Unset, app/compiler.py generates a fresh RSA key PER PROCESS -- so at replicaCount.api > 1
  # an SDK that fetches /sdk/v1/signing-key from one pod and /sdk/v1/bundle from another fails
  # signature verification, and every restart invalidates a pinned key.
  {{- range $key, $value := .Values.secretConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
