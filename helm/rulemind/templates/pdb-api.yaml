{{- /*
Rendered only when there is more than one replica to protect.

It used to render unconditionally with minAvailable: 2 (values.yaml pdb.minAvailable). On any
single-replica install -- values-kind.yaml sets replicaCount.api: 1, and so does anyone trying
the chart out -- that is a budget the cluster can never satisfy, so `kubectl drain` on that node
BLOCKS FOREVER. A node cannot be patched, a spot instance cannot be reclaimed, and the cluster
autoscaler stalls. The failure arrives during maintenance, which is the worst time to discover
that a disruption budget is the thing preventing disruption.

With the HPA enabled the floor is hpa.minReplicas, not replicaCount.api, because the HPA owns
the scale. */ -}}
{{- $replicas := ternary (int .Values.hpa.minReplicas) (int .Values.replicaCount.api) .Values.hpa.enabled -}}
{{- if gt $replicas 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rulemind-api
spec:
  {{- /* Never allow minAvailable to reach the replica count: that is also an undrainable node. */}}
  minAvailable: {{ min (int .Values.pdb.minAvailable) (sub $replicas 1) }}
  selector:
    matchLabels:
      app: rulemind-api
{{- end }}
