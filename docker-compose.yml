services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${RULEMIND_API_ORIGIN:-http://localhost:8080}
        NEXT_PUBLIC_RULEMIND_DEV_API_KEY: ${RULEMIND_DEV_API_KEY:-}
    ports:
      - "${RULEMIND_WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${RULEMIND_API_ORIGIN:-http://localhost:8080}
      NEXT_PUBLIC_RULEMIND_DEV_API_KEY: ${RULEMIND_DEV_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot schema migration. apps/python-executor/entrypoint.sh no longer runs
  # `alembic upgrade head` (it swallowed failures and every replica raced it), so
  # migrations happen exactly once, here, before api or worker start. The
  # Kubernetes equivalent is the pre-install/pre-upgrade Helm hook Job in
  # helm/rulemind/templates/job-migrate.yaml.
  migrate:
    build:
      context: .
      dockerfile: apps/python-executor/Dockerfile
    command: ["python3", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://rulemind:${POSTGRES_PASSWORD:-rulemind}@db:5432/rulemind
      RULEMIND_CONFIG_KEY: ${RULEMIND_CONFIG_KEY:-rulemind-dev-master-key}
      RULEMIND_ADMIN_JWT_SECRET: ${RULEMIND_ADMIN_JWT_SECRET:-rulemind-admin-dev-secret}
      RULEMIND_ENV: ${RULEMIND_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/python-executor/Dockerfile
    ports:
      - "${RULEMIND_API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://rulemind:${POSTGRES_PASSWORD:-rulemind}@db:5432/rulemind
      RULEMIND_CONFIG_KEY: ${RULEMIND_CONFIG_KEY:-rulemind-dev-master-key}
      RULEMIND_ADMIN_JWT_SECRET: ${RULEMIND_ADMIN_JWT_SECRET:-rulemind-admin-dev-secret}
      # RULEMIND_ENV was set in NO deployment artifact, so app/security_config.py
      # took its "warn and SKIP the default-secret check" branch everywhere. It is
      # explicit here — and deliberately `development`, not `production`: this
      # compose file runs on the committed dev secrets above, and RULEMIND_ENV=
      # production would (correctly) refuse to boot on them. helm and k8s set
      # production. Override with RULEMIND_ENV=production once you supply real
      # secrets.
      RULEMIND_ENV: ${RULEMIND_ENV:-development}
      # Empty by default: a compose stack must not seed demo policies into what someone may be
      # treating as a real environment. Declared here so it CAN be turned on from the outside --
      # scripts/smoke_compose.sh sets it, because its end-to-end check needs a policy to decide
      # against and there is otherwise nothing in the database.
      RULEMIND_SEED_DEMO: ${RULEMIND_SEED_DEMO:-}
      REDIS_URL: redis://redis:6379/0
      PYTHON_SANDBOX_TIMEOUT: 2000
      PYTHON_SANDBOX_MEMORY: 128
      # Explicit, and small: app/db.py defaults to 20+20 PER uvicorn worker
      # process. See the connection-budget arithmetic in helm/rulemind/values.yaml.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      CORS_ORIGINS: ${RULEMIND_WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Empty by default = tracing off. Set to http://otel-collector:4317 with the
      # observability profile to emit traces. Metrics are always on at /metrics.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: rulemind-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/python-executor/Dockerfile
    # No entrypoint override any more: the entrypoint is a plain `exec "$@"` wrapper
    # now that migrations moved to the `migrate` service, so there is nothing to
    # skip. (This service is built from the API Dockerfile — there is no separate
    # worker image, which is also why helm's image.worker defaults to the api repo.)
    command: ["python3", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://rulemind:${POSTGRES_PASSWORD:-rulemind}@db:5432/rulemind
      RULEMIND_CONFIG_KEY: ${RULEMIND_CONFIG_KEY:-rulemind-dev-master-key}
      RULEMIND_ADMIN_JWT_SECRET: ${RULEMIND_ADMIN_JWT_SECRET:-rulemind-admin-dev-secret}
      RULEMIND_ENV: ${RULEMIND_ENV:-development}
      # Empty by default: a compose stack must not seed demo policies into what someone may be
      # treating as a real environment. Declared here so it CAN be turned on from the outside --
      # scripts/smoke_compose.sh sets it, because its end-to-end check needs a policy to decide
      # against and there is otherwise nothing in the database.
      RULEMIND_SEED_DEMO: ${RULEMIND_SEED_DEMO:-}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys, time; path = '/tmp/rulemind-worker.ready'; sys.exit(0 if os.path.exists(path) and time.time() - os.path.getmtime(path) < 90 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rulemind
      POSTGRES_USER: rulemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rulemind}
    ports:
      - "${RULEMIND_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulemind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${RULEMIND_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka, KRaft mode — starts only with:  docker compose --profile kafka up
  #
  # KRaft, so there is no ZooKeeper: one container is the whole broker, acting as both
  # controller and broker. The old three-container Kafka+ZK topology is not worth its RAM on a
  # laptop, and ZooKeeper is removed in Kafka 4.
  #
  # Behind a profile because the decision path must keep working without it. app/decision_bus.py
  # already establishes that pattern for Redis -- publish is a no-op and the SSE feed falls back
  # to DB polling -- and the durable outbox relay follows it: the outbox row is committed in the
  # same transaction as the decision whether or not a broker is listening, so turning Kafka off
  # loses delivery, never data.
  #
  # Single broker, so replication factors are all 1. That is the one thing here that is a local
  # concession rather than a design: exactly-once across a partition needs the transaction state
  # log replicated in production (min.insync.replicas > 1), and with one broker it cannot be.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    ports:
      - "${RULEMIND_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # Two advertised listeners on purpose: containers on this network reach the broker at
      # kafka:19092, while anything on the host reaches it at localhost:9092. A single listener
      # cannot satisfy both -- the broker hands its advertised address back to the client after
      # the initial connect, so a host client told "kafka:19092" fails DNS on the second hop.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${RULEMIND_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # All 1 because there is one broker. Left at the 3-replica defaults the broker refuses to
      # create its own internal topics and never finishes starting.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${RULEMIND_KAFKA_CLUSTER_ID:-rulemind-local-cluster-0}
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # A broker that answers the API is ready; a TCP port check passes several seconds earlier,
      # while the controller is still electing, and a producer connecting in that window fails.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Observability stack — starts only with:  docker compose --profile observability up
  # Grafana at http://localhost:3001 (admin/admin). Prometheus scrapes /metrics;
  # Tempo receives OTLP traces via the collector. Pre-provisioned datasources +
  # a starter dashboard. To emit traces, also set OTEL_EXPORTER_OTLP_ENDPOINT.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${RULEMIND_OTLP_PORT:-4317}:4317"

  tempo:
    image: grafana/tempo:2.6.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The rules file prometheus.yml references; without this mount Prometheus starts and
      # silently evaluates nothing, which looks identical to "no alerts are firing".
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${RULEMIND_PROM_PORT:-9090}:9090"
    depends_on:
      - alertmanager

  # Where the alert rules actually GO. Without this, prometheus.yml's `alerting` block points at
  # nothing, rules evaluate, alerts turn red on Prometheus's own page, and no human is told --
  # which is indistinguishable from "everything is fine". alertmanager.yml shipped a day before
  # anyone noticed nothing was wired to it.
  # Formats Alertmanager's webhook envelope into a notification a human can act on -- title,
  # priority from severity, an emoji, and a tappable runbook. Pointing Alertmanager straight at a
  # push service delivers the raw JSON envelope instead, which is a notification that tells you
  # nothing in the ten seconds that matter. See observability/alert-relay/relay.py.
  alert-relay:
    build:
      context: ./observability/alert-relay
    profiles: ["observability"]
    environment:
      # Override to a self-hosted ntfy for production: alert summaries should not leave the
      # perimeter of a decisioning engine, and ntfy's server is one container.
      RULEMIND_NTFY_BASE: ${RULEMIND_NTFY_BASE:-https://ntfy.sh}
      RULEMIND_NTFY_TOPIC_FILE: /etc/alert-relay/topic
    volumes:
      - ./observability/secrets:/etc/alert-relay:ro
    ports:
      # Published so the chain can be verified from OUTSIDE it. Alertmanager posting successfully
      # to a relay that cannot reach its upstream is a delivery that looks fine and reaches
      # nobody -- scripts/verify_paging.sh asks the relay directly, and could not while this was
      # in-network only.
      - "${RULEMIND_RELAY_PORT:-9097}:9097"
    healthcheck:
      # Reports unhealthy while no destination is configured, so "paging is set up" is visible in
      # `docker compose ps` rather than discovered when something breaks.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9097/', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Notices when the heartbeat STOPS and pages about it. Five of the six ways alerting dies are
  # local (a dead relay, a broken Alertmanager reload, a misrouted receiver, Prometheus stopping,
  # a container not coming back); only "the whole machine died" needs a different failure domain,
  # and that is what observability/secrets/watchdog_url is for. This closes the five for free.
  # monitor.py is explicit about that limit, including in the page it sends.
  watchdog-monitor:
    build:
      context: ./observability/watchdog-monitor
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      RULEMIND_NTFY_BASE: ${RULEMIND_NTFY_BASE:-https://ntfy.sh}
      RULEMIND_HEARTBEAT_TOPIC_FILE: /etc/watchdog-monitor/heartbeat_topic
      RULEMIND_TOPIC_FILE: /etc/watchdog-monitor/topic
      RULEMIND_WATCHDOG_GRACE_S: ${RULEMIND_WATCHDOG_GRACE_S:-960}
    volumes:
      - ./observability/secrets:/etc/watchdog-monitor:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The alert destination, read from a gitignored file so enabling paging never means
      # committing a credential. Read-only, and absent on a fresh clone -- Alertmanager reads
      # `url_file` at notify time, so it starts fine either way.
      - ./observability/secrets:/etc/alertmanager/secrets:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${RULEMIND_ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${RULEMIND_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  kafkadata:
  pgdata:
  redisdata:
  tempodata:
  grafanadata:
