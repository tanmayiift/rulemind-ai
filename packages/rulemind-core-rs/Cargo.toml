[package]
name = "rulemind_core_rs"
version = "0.1.0"
edition = "2021"
description = "RuleMind decision eval-core in Rust (native + WASM + PyO3)"
license = "Apache-2.0"

[lib]
name = "rulemind_core_rs"
# cdylib -> Python extension / WASM; rlib -> native Rust consumers/tests
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
regex = "1"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["python"]
# `python` pulls in PyO3 for the CPython extension.
python = ["dep:pyo3"]
# `wasm` exposes a wasm-bindgen JS interface for edge/browser/on-device:
#   wasm-pack build --no-default-features --features wasm --target web
wasm = ["dep:wasm-bindgen"]
