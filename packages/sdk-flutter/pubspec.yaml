name: rulemind
description: RuleMind decisioning and workflow-aware SDK for Flutter
version: 4.1.0-beta.1
homepage: https://github.com/rulemind-ai/rulemind
repository: https://github.com/rulemind-ai/rulemind
issue_tracker: https://github.com/rulemind-ai/rulemind/issues
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  asn1lib: ^1.5.8
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  http: ^1.2.1
  path: ^1.9.0
  pointycastle: ^3.7.4
  sqflite: ^2.3.3
  workmanager: ^0.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  # Headless SQLite for CI tests of the durable decision outbox (no device needed).
  sqflite_common_ffi: ^2.3.3
