name: rulemind
description: RuleMind decisioning and workflow-aware SDK for Flutter
version: 4.2.0-beta.1
homepage: https://github.com/rulemind-ai/rulemind
repository: https://github.com/rulemind-ai/rulemind
issue_tracker: https://github.com/rulemind-ai/rulemind/issues
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  asn1lib: ^1.5.8
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  http: ^1.2.1
  path: ^1.9.0
  path_provider: ^2.1.4
  pointycastle: ">=3.7.4 <5.0.0"
  sqflite: ^2.3.3
  workmanager: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  # Headless SQLite for CI tests of the durable decision outbox (no device needed).
  sqflite_common_ffi: ^2.3.3

# Upstream breakage, not ours: package:sqlite3 3.5.2's build.dart downloads a
# prebuilt libsqlite3.x64.linux.so and verifies its hash, and the hosted file no
# longer matches the pin -- so `flutter test` fails on Linux CI with
# "Bad state: Hash of downloaded file ... expected b17729184e...". macOS is
# unaffected because the binary is not downloaded there.
# sqlite3 arrives only via sqflite_common_ffi, a dev dependency used by the
# outbox test. Remove this once 3.5.3 ships.
dependency_overrides:
  sqlite3: 3.5.1
