# Type checking for the RuleMind backend.
#
# `typecheck` used to be `python3 -m py_compile app/*.py` -- byte-compilation, not type
# checking, and a glob that missed all 22 files under app/routers/ and app/core/. It could
# not fail on a type error because it never looked for one.
#
# The ratchet is now DONE. This file previously exempted 31 modules with 282 recorded errors
# (the real figure was 225 -- the counts had drifted, and one block was already dead). Every
# one of them is fixed and checked, including storage.py, which went from 53 errors to zero.
#
# The single largest cause was not in storage.py at all: seed_data.py's six literals were
# unannotated, so mypy inferred list[dict[str, object]] and every consumer saw `object`.
# Annotating them cleared 34 of storage.py's errors without editing storage.py.
#
# ONE narrow exemption remains, below. Do not add to it.
[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
show_error_codes = True
exclude = (?x)(^alembic/|^\.runtime/)

# app.main: 23 `has-type: Cannot determine type of "router"` errors, all one architectural
# cause -- the deliberate main <-> routers import cycle. Routers do `from .. import main` and
# read main.storage at call time; main imports all 18 routers at the bottom (:1660-1687) and
# re-exports their handlers as module attributes (:1709-1724) because tests patch
# app.main.*. Breaking that cycle means a registry or deps module, all 18 routers, and every
# test that patches app.main -- a large diff in the request path for a static-analysis-only
# win. Every OTHER error class in main.py is checked; only this one is disabled.
[mypy-app.main]
disable_error_code = has-type
