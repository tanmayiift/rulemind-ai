# Alembic configuration for RuleMind's control-plane database.
#
# The container entrypoint runs `alembic -c alembic.ini upgrade head` on startup.
# The actual database URL comes from the DATABASE_URL environment variable
# (see alembic/env.py: get_url() prefers DATABASE_URL over sqlalchemy.url); the
# value below is only a local-dev fallback used when DATABASE_URL is unset.
[alembic]
script_location = alembic
prepend_sys_path = .
# Local-dev fallback only — overridden by $DATABASE_URL in every real environment.
sqlalchemy.url = sqlite:///./.runtime/rulemind_v4.db


# Logging configuration (required: env.py calls fileConfig on this file).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
