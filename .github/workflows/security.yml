name: security

# The repo had no security scanning of any kind -- no CodeQL, no Dependabot,
# no semgrep, trivy, bandit, pip-audit or pnpm audit -- and .github/ had no
# CODEOWNERS. This is the first thing an enterprise security review asks for.
# SELF-HOSTED, so: workflow_dispatch + schedule ONLY. No push, no pull_request -- this executes
# on the maintainer's machine as their user, and the repo has 16 open bot-authored dependency
# PRs. The weekly cron is kept deliberately: a scheduled audit is the only thing that catches a
# NEW advisory filed against code that has not changed, which no commit-triggered run would.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE CodeQL JOB WAS REMOVED 2026-09-16, because it can never succeed on this repository.
  #
  # Verified against the API rather than assumed:
  #   GET   /repos/.../code-scanning/alerts        -> "Code scanning is not enabled"
  #   PATCH /repos/... advanced_security=enabled   -> 422 "Advanced security has not been purchased."
  #
  # CodeQL on a PRIVATE repo needs GitHub Advanced Security, a paid add-on. Without it the
  # analyze step has nowhere to upload its SARIF, so the job does all the work and then fails.
  # It ran 85 times and succeeded zero times.
  #
  # To bring it back: buy GHAS, or make the repository public (public repos get code scanning
  # free). Until one is true, a check that always fails is worse than no check -- it teaches
  # everyone to ignore a red security result.

  dependencies:
    runs-on: [self-hosted, rulemind]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          set -eu
          # Pinned to 3.11: bare python3 here is Homebrew 3.14, which has no psycopg2-binary
          # wheel and falls back to a source build needing pg_config.
          VENV="$HOME/.cache/rulemind-security-venv"
          PY=""
          for c in python3.11 python3.12 "$HOME/.local/opt/python311/bin/python3"; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PY="$c"; break; fi
          done
          [ -n "$PY" ] || { echo "::error::no python3.11/3.12 found"; exit 1; }
          [ -x "$VENV/bin/python" ] || "$PY" -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip pip-audit
          "$VENV/bin/pip" install -q -r apps/python-executor/requirements.txt
          echo "$VENV/bin" >> "$GITHUB_PATH"
          corepack enable >/dev/null 2>&1 || true
          pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Both audits were `continue-on-error: true`, so they reported forever and
      # blocked nothing. They are now GATING, with an explicit ignore list for the
      # backlog that existed when the gate went in (triaged 2026-09-03).
      #
      # The rule for this list: every entry names a real, currently-unfixed
      # advisory and the version that fixes it. Bump the dependency, delete the
      # line. Nothing outside the list is tolerated, so any NEW high/critical
      # advisory — including a new one in these same packages — fails the build.
      # Do not add an entry without the fix version and a reason.
      # ---------------------------------------------------------------------
      - name: pip-audit (gating, with documented backlog)
        run: |
          set -euo pipefail
          # --- backlog: fixable by bumping the pin in requirements.txt ---
          #
          # Every entry here must still be REPORTED by pip-audit. 13 lines used to name
          # advisories against pyjwt, lxml, python-dotenv, lightgbm and cryptography that had
          # already been fixed by bumping the pin -- pip-audit accepts an id it never saw without
          # complaint, so they sat here as pre-armed suppressions. Pin pyjwt back one day for a
          # compatibility fix and seven advisories against the library that validates admin
          # session JWTs and OIDC assertions would have been excused again, silently.
          # scripts/check_audit_ignores.py (run below) now fails the job when that recurs.
          IGNORES=(
            # cryptography 46.0.7 -> 48.0.1 / 49.0.0 / 50.0.0
            --ignore-vuln PYSEC-2026-3552    # cryptography: fixed in 50.0.0
            --ignore-vuln PYSEC-2026-3553    # cryptography: fixed in 49.0.0
            --ignore-vuln PYSEC-2026-3554    # cryptography: fixed in 49.0.0
            --ignore-vuln GHSA-537c-gmf6-5ccf # cryptography: fixed in 48.0.1
            # starlette 0.41.3 -> 1.3.1, which requires a coordinated fastapi bump
            --ignore-vuln PYSEC-2026-161     # starlette: fixed in 1.0.1
            --ignore-vuln PYSEC-2026-248     # starlette: fixed in 1.3.0
            --ignore-vuln PYSEC-2026-249     # starlette: fixed in 1.3.1
            --ignore-vuln PYSEC-2026-1941    # starlette: fixed in 0.47.2
            --ignore-vuln PYSEC-2026-1942    # starlette: fixed in 0.49.1
            --ignore-vuln PYSEC-2026-2280    # starlette: fixed in 1.1.0
            --ignore-vuln PYSEC-2026-2281    # starlette: fixed in 1.1.0
          )
          pip-audit --requirement apps/python-executor/requirements.txt --desc "${IGNORES[@]}"

      - name: No dead advisory suppressions
        run: python scripts/check_audit_ignores.py

      - name: pnpm audit (gating, with documented backlog)
        run: |
          set -euo pipefail
          # pnpm's own --audit-level cannot exempt individual advisories, and the
          # package.json `pnpm.auditConfig.ignoreGhsas` field is not used here, so
          # the filtering is done on the JSON report.
          pnpm audit --json > /tmp/pnpm-audit.json || true
          cat > /tmp/audit-ignore.json <<'JSON'
          {
            "_comment": "Known high/critical advisories, 2026-09-03. Fix = bump the package; then delete the entry.",

            "GHSA-5xrq-8626-4rwp": "vitest 3.2.4 -> 3.2.6. CRITICAL but dev-only: the Vitest UI server never runs in CI or in any shipped image.",

            "GHSA-36qx-fr4f-26g5": "next 14.2.25 -> 14.2.34+ (patch bump, no major).",
            "GHSA-5j59-xgg2-r9c4": "next 14.2.25 -> 14.2.34+.",
            "GHSA-89xv-2m56-2m9x": "next 14.2.25 -> 14.2.34+.",
            "GHSA-8h8q-6873-q5fj": "next 14.2.25 -> 14.2.34+.",
            "GHSA-c4j6-fc7j-m34r": "next 14.2.25 -> 14.2.34+.",
            "GHSA-h25m-26qc-wcjf": "next 14.2.25 -> 14.2.34+.",
            "GHSA-m99w-x7hq-7vfj": "next 14.2.25 -> 14.2.34+.",
            "GHSA-mwv6-3258-q52c": "next 14.2.25 -> 14.2.34+.",
            "GHSA-p9j2-gv94-2wf4": "next 14.2.25 -> 14.2.34+.",
            "GHSA-q4gf-8mx6-v5v3": "next 14.2.25 -> 14.2.34+.",

            "GHSA-fx2h-pf6j-xcff": "vite, transitive via vitest. Dev server only; not in any shipped image.",
            "GHSA-p9ff-h696-f583": "vite, transitive via vitest. Dev server only.",
            "GHSA-v2wj-q39q-566r": "vite, transitive via vitest. Dev server only.",

            "GHSA-6g55-p6wh-862q": "postcss, transitive build-time dependency.",
            "GHSA-r28c-9q8g-f849": "postcss, transitive build-time dependency.",

            "GHSA-28wg-ghj8-5hjv": "nanoid, transitive. Not used to generate anything security-sensitive here.",
            "GHSA-2v37-7h3g-55p8": "nanoid, transitive.",
            "GHSA-xwg4-73v4-xw9w": "nanoid, transitive.",

            "GHSA-4r6h-8v6p-xvw6": "xlsx (SheetJS) 0.18.5. NO npm fix exists - SheetJS left the npm registry, advisory says 'patched versions: <0.0.0'. Real fix is to install from cdn.sheetjs.com or drop the dependency.",
            "GHSA-5pgg-2g8v-p4x9": "xlsx (SheetJS) 0.18.5. Same: no npm fix available.",

            "_next15_comment": "The two below are CRITICAL and BOTH need Next >= 15.5.24 -- a MAJOR upgrade from 14.2.x, not a patch. Triaged 2026-09-16 with evidence, not dismissed: each was checked against how this app is actually built and run. The upgrade is real remediation work and is tracked; these entries are why it is not an emergency, and they must be deleted the moment Next moves to 15.5.24+.",
            "GHSA-p293-qw3h-jr36": "next: unauthenticated RCE on WINDOWS-HOSTED servers. Not applicable: apps/web/Dockerfile is node:20-alpine, so every shipped image is Linux. Fixed by Next >= 15.5.24.",
            "GHSA-2xp9-vwfh-vxw4": "next: unauthenticated RCE in the Image Optimization API via AVIF. Surface is closed by configuration here -- there are ZERO next/image imports in apps/web, no images.remotePatterns or images.domains block in next.config.js, and /_next/image answers HTTP 400 for a remote URL (probed on the running container 2026-09-16). Fixed by Next >= 15.5.24."
          }
          JSON
          node -e '
            const report = require("/tmp/pnpm-audit.json");
            const ignore = require("/tmp/audit-ignore.json");
            const unexpected = [];
            for (const a of Object.values(report.advisories || {})) {
              if (a.severity !== "high" && a.severity !== "critical") continue;
              const id = a.github_advisory_id || String(a.id);
              if (Object.prototype.hasOwnProperty.call(ignore, id)) continue;
              unexpected.push(`${a.severity.padEnd(8)} ${id}  ${a.module_name}  ${a.title}`);
            }
            const ignored = Object.keys(ignore).filter((k) => k !== "_comment").length;
            console.log(`pnpm audit: ${ignored} known advisories on the documented ignore list.`);
            if (unexpected.length) {
              console.error("\nNEW high/critical advisories not on the ignore list:\n");
              unexpected.forEach((l) => console.error("  " + l));
              console.error("\nFix the dependency, or add the advisory id to the ignore list above with the fix version and a reason.");
              process.exit(1);
            }
            console.log("No new high/critical advisories.");
          '
