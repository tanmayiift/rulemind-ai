# Build and publish the container images the Helm chart references, for amd64 AND arm64.
#
# WHY THIS EXISTS. Before it, nothing in this repository built or pushed an image, so
# `helm install` against a real cluster ImagePullBackOff'd on every pod. Its first version ran on
# the maintainer's Apple-silicon machine with a plain `docker build`, so every published image
# was arm64-only -- unusable on the amd64 nodes most clusters run. Each architecture now builds
# natively on its own GitHub-hosted runner (no QEMU), by digest, and one multi-arch manifest is
# assembled from both, then signed (keyless, Sigstore) with SBOM and provenance attached.
#
# WORKFLOW_DISPATCH ONLY. A `push` trigger would publish an artifact from code nobody chose to
# release. Do not add one.
name: release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 4.0.0). Also tagged :latest."
        required: true
        type: string
      push:
        description: "Push to the registry. Unchecked = build only, to prove both architectures build."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: api
            dockerfile: apps/python-executor/Dockerfile
          # No NEXT_PUBLIC_API_BASE_URL build arg on purpose: apps/web/src/lib/store.ts resolves
          # the API base from the serving origin at runtime, so ONE image works in every cluster.
          - image: web
            dockerfile: apps/web/Dockerfile
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/rulemind-${{ matrix.image }}
    steps:
      - name: Reject a tag that cannot be rolled back to
        # `latest` alone is not a version: `helm rollback` restores a Deployment whose image
        # reference is unchanged. docs/runbooks/rollback.md depends on an immutable tag.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            latest|"") echo "::error::supply a real version, not '$VERSION'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REPO) || 'type=cacheonly' }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: inputs.push
        name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (Sigstore OIDC)
    strategy:
      matrix:
        image: [api, web]
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/rulemind-${{ matrix.image }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          test "$(ls | wc -l)" -eq 2 || { echo "::error::expected 2 digests (amd64, arm64), got: $(ls)"; exit 1; }
          docker buildx imagetools create -t "$REPO:$VERSION" -t "$REPO:latest" \
            $(printf "$REPO@sha256:%s " *)
          docker buildx imagetools inspect "$REPO:$VERSION"
          docker buildx imagetools inspect "$REPO:$VERSION" --format '{{json .Manifest}}' \
            | python3 -c "import json,sys; m=json.load(sys.stdin); a={p['platform']['architecture'] for p in m.get('manifests',[]) if p.get('platform',{}).get('os')=='linux'}; print(sorted(a)); sys.exit(0 if {'amd64','arm64'}<=a else 1)"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: |
          set -eu
          DIGEST=$(docker buildx imagetools inspect "$REPO:$VERSION" --format '{{json .Manifest}}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          cosign sign --yes "$REPO@$DIGEST"
          {
            echo "### rulemind-${{ matrix.image }}"
            echo ""
            echo "\`$REPO:$VERSION\` (amd64 + arm64), signed: \`$DIGEST\`"
            echo ""
            echo "Verify: \`cosign verify $REPO@$DIGEST --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
