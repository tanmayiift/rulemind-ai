name: sdk-verify

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  # The emulator jobs run ONLY from here. They are the most expensive thing in
  # this repo (two ~15-25 min boots) and they have been failing for an external
  # reason since a runner-image rollout (#133), so paying for them on every push
  # bought nothing. Dispatch this workflow to get the full mobile signal.
  workflow_dispatch:

permissions:
  contents: read

# Neither workflow had one, so every push to a PR branch ran a full duplicate
# set alongside the one it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      emulator: ${{ steps.filter.outputs.emulator }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mobile-affecting changes
        id: filter
        run: |
          # The emulator jobs are dispatch-only, never automatic. See the
          # workflow_dispatch comment at the top and #133.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "emulator=true" >> "$GITHUB_OUTPUT"
          else
            echo "emulator=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - running everything"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            # A push previously fanned out to EVERYTHING, so a docs-only commit
            # booted two emulators. Diff against the pushed range instead.
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # All-zeroes means a new branch or a force-push with no usable base.
            case "$BASE" in
              0000000000000000000000000000000000000000|"") BASE=$(git rev-parse "$HEAD~1" 2>/dev/null || echo "$HEAD") ;;
            esac
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "$CHANGED" | sed 's/^/  changed: /'
          # The mobile jobs run the Kotlin and Dart halves of the five-engine
          # semantics contract (LargePolicyConformanceTest.kt,
          # large_policy_conformance_test.dart). So the filter has to cover two
          # different things:
          #
          #   1. The SDK sources themselves -- packages/sdk-android/,
          #      packages/sdk-flutter/, packages/flutter-ui/, demo-app/. These
          #      were already here.
          #   2. The inputs those conformance tests are checked AGAINST. That is
          #      the point the previous version of this filter missed: it
          #      excluded apps/python-executor/ wholesale on the grounds that
          #      "the mobile jobs are dart analyze + flutter test + gradle JVM
          #      tests -- none of which touch the backend". True of the runtime,
          #      false of the contract. app/logic.py is the declared source of
          #      truth for operator semantics across all five engines, and
          #      packages/shared/*.spec.json are the shared conformance corpora
          #      the Kotlin and Dart tests load. Editing either is *precisely*
          #      the change that makes the two engines drift, and it ran neither
          #      arm. The three backend files are listed individually rather
          #      than as apps/python-executor/**, so an unrelated router or
          #      migration still does not boot a mobile job.
          #
          # qa/mobile_e2e/ and .github/workflows/ stay out: the first is the
          # emulator harness (dispatch-only), and a workflow edit should be
          # validated by workflow_dispatch, not by a paid fan-out.
          #
          # Two named patterns rather than one alternation, because the two
          # halves match differently and should be readable as such: the first
          # is directory prefixes (anything under them counts), the second is
          # three exact files, anchored with `$` so it cannot widen into a
          # prefix match on app/logic.py.bak or a same-named file in a
          # subdirectory. Keeping the anchor at the end of its own pattern also
          # sidesteps POSIX leaving a non-terminal `$` undefined -- GNU and BSD
          # both happen to anchor it, but a gate should not lean on that.
          # Both are exercised by tests; see the "Verify the mobile path filter"
          # step below, which reads these two variables straight out of this
          # file so the assertions cannot drift from the pattern they check.
          MOBILE_PREFIXES='^(packages/sdk-android/|packages/sdk-flutter/|packages/flutter-ui/|demo-app/|packages/shared/)'
          MOBILE_FILES='^apps/python-executor/app/(logic|decision_tables|safe_formula)\.py$'
          if echo "$CHANGED" | grep -qE "$MOBILE_PREFIXES" || echo "$CHANGED" | grep -qE "$MOBILE_FILES"; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "-> mobile jobs WILL run"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
            echo "-> mobile jobs skipped (no mobile SDK, shared spec or engine-semantics files touched)"
          fi
          # Playwright drives the web app against the backend, so either one
          # changing is a reason to run it. It is the most expensive job here
          # (~8 min), so a mobile-only or docs-only PR should not pay for it.
          if echo "$CHANGED" | grep -qE '^(apps/web/|apps/python-executor/|e2e/|playwright\.config\.ts|package\.json|pnpm-lock\.yaml)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "-> Playwright WILL run"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "-> Playwright skipped (no web/backend files touched)"
          fi

  # Two guards that already existed in the repo and were wired to nothing.
  # Deliberately has no `needs:` and no path filter: it is checkout + setup-python
  # + two stdlib scripts, well under a minute, so making it conditional would cost
  # more in reasoning than it saves in runner time. It is also the only job here
  # that can fail for a reason a reviewer can act on in seconds.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # docs/parity/check_parity.py has existed since the parity matrix was
      # written and ran in no workflow, so the invariant it exists to hold --
      # every ABSENT/PARTIAL row keeps an owning phase and a named E2E flow, and
      # every row cites evidence -- was enforced by nothing but good intentions.
      # A gap that loses its owner is exactly the kind of rot the matrix was
      # meant to prevent. stdlib only, one JSON file, no install step.
      - name: Check the parity matrix has not rotted
        run: python docs/parity/check_parity.py

      # The mobile filter in `changes` decides whether the Kotlin and Dart arms
      # of the five-engine semantics contract run at all, and it is a regex
      # inside a shell script -- the least reviewable kind of gate there is, with
      # the nastiest failure mode: a wrong pattern does not error, it silently
      # reports mobile=false and the jobs are skipped as if nothing was affected.
      # That is precisely how apps/python-executor/app/logic.py -- the declared
      # source of truth for operator semantics in all five engines -- and
      # packages/shared/*.spec.json -- the corpora the Kotlin and Dart
      # conformance tests load -- came to be exempt from the two jobs that check
      # them.
      #
      # These assertions parse MOBILE_PREFIXES and MOBILE_FILES out of this file
      # and run them through the same `grep -qE` the job uses, so they cannot
      # drift from the pattern they are checking. Both directions are asserted:
      # the paths that MUST trigger the mobile jobs, and the neighbouring paths
      # that must NOT (a filter that matches everything is as useless as one
      # that matches nothing).
      - name: Verify the mobile path filter
        run: |
          python - <<'PY'
          import pathlib, re, shlex, subprocess, sys

          src = pathlib.Path(".github/workflows/sdk-verify.yml").read_text()
          prefixes = re.search(r"MOBILE_PREFIXES='([^']+)'", src).group(1)
          files = re.search(r"MOBILE_FILES='([^']+)'", src).group(1)
          print(f"MOBILE_PREFIXES = {prefixes}")
          print(f"MOBILE_FILES    = {files}\n")

          MUST_MATCH = [
              # The engine-semantics contract. These are the whole point.
              "apps/python-executor/app/logic.py",
              "apps/python-executor/app/decision_tables.py",
              "apps/python-executor/app/safe_formula.py",
              "packages/shared/operators.spec.json",
              "packages/shared/large-policy.spec.json",
              "packages/shared/decision-tables.spec.json",
              # The SDK sources the mobile jobs build and test.
              "packages/sdk-android/rulemind-core/src/test/kotlin/com/rulemind/core/LargePolicyConformanceTest.kt",
              "packages/sdk-flutter/test/large_policy_conformance_test.dart",
              "packages/flutter-ui/lib/theme.dart",
              "demo-app/lib/main.dart",
          ]
          MUST_NOT_MATCH = [
              # Backend files with no bearing on cross-engine semantics. The
              # three names above are listed individually so these stay cheap.
              "apps/python-executor/app/storage.py",
              "apps/python-executor/app/main.py",
              "apps/python-executor/app/middleware.py",
              "apps/python-executor/app/routers/rules.py",
              "apps/python-executor/alembic/versions/0001_init.py",
              "apps/python-executor/tests/test_operators.py",
              # Near-misses that a prefix match would wrongly catch.
              "apps/python-executor/app/logic.py.bak",
              "apps/python-executor/app/nested/logic.py",
              # Everything else.
              "apps/web/app/page.tsx",
              "packages/rule-engine/src/evaluator.ts",
              "packages/sdk-js/src/index.ts",
              "docs/parity/parity.json",
              "README.md",
              ".github/workflows/sdk-verify.yml",
              "qa/mobile_e2e/start_fastapi.sh",
          ]

          def triggers(path: str) -> bool:
              """Exactly the condition the `changes` job evaluates."""
              q, qp, qf = shlex.quote(path), shlex.quote(prefixes), shlex.quote(files)
              cmd = f"echo {q} | grep -qE {qp} || echo {q} | grep -qE {qf}"
              return subprocess.run(["bash", "-c", cmd]).returncode == 0

          failures = []
          for path in MUST_MATCH:
              ok = triggers(path)
              print(f"  {'ok  ' if ok else 'FAIL'} should trigger mobile: {path}")
              if not ok:
                  failures.append(f"{path} must trigger the mobile jobs but does not")
          for path in MUST_NOT_MATCH:
              ok = not triggers(path)
              print(f"  {'ok  ' if ok else 'FAIL'} should NOT trigger mobile: {path}")
              if not ok:
                  failures.append(f"{path} must not trigger the mobile jobs but does")

          if failures:
              print("\nmobile path filter is wrong:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"\nmobile path filter OK - {len(MUST_MATCH)} trigger, {len(MUST_NOT_MATCH)} do not")
          PY

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/rulemind-core-rs
            packages/rulemind-decide-service

      # --no-default-features is required, not a preference. Cargo.toml sets
      # default = ["python"], which pulls pyo3 with `extension-module` -- that
      # feature deliberately does NOT link libpython, so a plain `cargo test`
      # builds a test binary with unresolved CPython symbols and fails at link
      # time. Documented at packages/rulemind-core-rs/README.md:8.
      - name: Run Rust core conformance tests
        working-directory: packages/rulemind-core-rs
        run: cargo test --no-default-features --verbose

      # This was `cargo check` with a comment claiming "the service has no tests of its
      # own". It has 10, in src/, and none had ever executed. `cargo test` compiles the
      # same code, so this is strictly more coverage for roughly the same runner time.
      - name: Test the decide service
        working-directory: packages/rulemind-decide-service
        run: cargo test --verbose

  repo-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # CI has only ever run SQLite; every Postgres pass in E2E_TEST_PLAN.md was
    # manual. A service container costs ~10s to become healthy and no extra
    # runner, so the suite can be run against the engine production actually
    # uses. psycopg2-binary is already in requirements.txt -- no new dependency.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rulemind
          POSTGRES_PASSWORD: rulemind
          POSTGRES_DB: rulemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # tests/test_redis_integration.py is skipUnless(REDIS_URL) and no workflow ever set it,
      # so its 10 tests had never run -- despite the suite having already found two production
      # bugs when run by hand. Rate limiting, the decision bus and distributed locks are Redis
      # code paths that only exist in production, so SQLite-lane green says nothing about them.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The two decision-archive sinks anyone would actually deploy. Both were entirely
      # untested: test_decision_archiver covers the archive-then-purge contract with an
      # in-memory sink and says so, which left the ClickHouse column list and the S3 object
      # layout unverified -- and `retention_enforced` reported true for either of them whether
      # or not its client library was even installed.
      clickhouse:
        image: clickhouse/clickhouse-server:24-alpine
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: rulemind
          MINIO_ROOT_PASSWORD: rulemind123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/python-executor/requirements.txt

      # tests/test_rust_core.py is skipUnless(rulemind_core_rs importable) and nothing ever
      # built it, so all 3 tests always skipped -- and, more importantly, so did the
      # `_HAVE_RUST` branch at app/fast_decide.py:328. That branch is what production takes
      # for a rules-only policy, so the fast path had zero coverage while the fallback it
      # never uses had all of it. This is the suite that would have caught the `fieldType`
      # divergence.
      #
      # `-i` is required, not tidiness: maturin otherwise resolves whatever `python3` it finds
      # first, and PyO3 0.23 hard-errors on CPython > 3.13. Pin it to the interpreter the
      # tests will actually import from.
      - name: Build and install the Rust PyO3 extension
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release -i "$(which python)" \
            --manifest-path packages/rulemind-core-rs/Cargo.toml --out dist-rs
          python -m pip install --force-reinstall dist-rs/*.whl
          python -c "import rulemind_core_rs; print('rulemind_core_rs loaded')"

      # The archive-sink clients are lazy optional imports and are deliberately NOT in
      # requirements.txt -- they are only needed when that sink is selected, and pulling three
      # heavy wheels into every deployment for a feature most tenants do not use is the wrong
      # trade. They are installed here so the live round-trip suite can run at all.
      - name: Install optional archive-sink clients
        run: python -m pip install clickhouse-connect boto3

      - name: Run Python backend tests
        run: python -m unittest discover -s apps/python-executor/tests -p 'test_*.py'

      # The 21-case sandbox-escape matrix -- import os, __import__, open, eval,
      # subclass-walks to Popen, socket, subprocess, file writes. The highest-value security
      # test in the repo, and until this step existed it had never run in CI at all.
      #
      # Both suites gate. The "25 pass / 5 fail" this comment used to describe was fixed in
      # 4090911, and 8 of those 25 "passes" were not passes at all -- suite_core swallowed
      # non-200s as success, so the entire sandbox-escape section was asserting nothing until
      # d773776. Both are at full green now, which is why neither is exempt.
      #
      # start_fastapi.sh already sets RULEMIND_SEED_DEMO=1, which the suite
      # needs -- its control case drafts against the seeded `custom` connector
      # and 422s without it.
      # The same suite against Postgres. Only DATABASE_URL changes:
      # storage.py:480,488 calls create_all, which builds the whole schema on a
      # fresh container, so Alembic is not needed here (alembic.ini hardcodes a
      # SQLite URL -- pointing it at Postgres is separate, larger work).
      # DATABASE_URL alone made this lane a near-no-op: 66 of the 124 modules construct
      # Storage(path=...) for per-test isolation, and db.database_url() short-circuited to
      # SQLite whenever a path was given. 797 of 1360 tests were re-running the SQLite lane
      # under a Postgres label. RULEMIND_TEST_PG_SCHEMA_PER_PATH gives each of those paths a
      # dedicated Postgres SCHEMA instead -- the Postgres equivalent of its own file -- so the
      # isolation survives and the queries are genuinely Postgres.
      - name: Run Python backend tests against PostgreSQL
        working-directory: apps/python-executor
        env:
          DATABASE_URL: postgresql://rulemind:rulemind@localhost:5432/rulemind
          RULEMIND_TEST_PG_SCHEMA_PER_PATH: "1"
          REDIS_URL: redis://localhost:6379/9
          CLICKHOUSE_URL: http://127.0.0.1:8123
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: rulemind
          AWS_SECRET_ACCESS_KEY: rulemind123
          AWS_REGION: us-east-1
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Start FastAPI backend for QA suites
        run: |
          bash qa/mobile_e2e/start_fastapi.sh
          bash qa/mobile_e2e/wait_for_health.sh

      - name: Run sandbox escape matrix
        working-directory: qa/e2e-full
        env:
          RM_BASE: http://127.0.0.1:8080
          RM_OUT: ${{ github.workspace }}/qa/results/results_sandbox.json
        run: python run.py sandbox

      # GATING as of the 8-fake-pass fix. The "5 failures" this step was waiting on were fixed
      # in 4090911; the suite has been at 31/31 since, and the gate was simply never switched
      # back on. Leaving it non-gating meant the one suite that drives a real server and probes
      # the sandbox-escape matrix could go red without anyone noticing.
      - name: Run core QA suite
        working-directory: qa/e2e-full
        env:
          RM_BASE: http://127.0.0.1:8080
          RM_OUT: ${{ github.workspace }}/qa/results/results_core.json
        run: python run.py core

      - name: Stop FastAPI backend
        if: always()
        run: bash qa/mobile_e2e/stop_fastapi.sh

      # Real static analysis. `pnpm typecheck` maps to py_compile for the
      # backend, which is byte-compilation over a glob that misses every router.
      - name: Lint and type-check the backend
        working-directory: apps/python-executor
        run: |
          ruff check app tests
          mypy app

      # Contract breaks used to ship silently -- nothing compared the public API surface
      # between commits. This fails ONLY on breaking changes (removed operation or field,
      # newly required field, removed enum value); additive changes print and pass, because a
      # gate that fires on every addition gets regenerated reflexively and stops being a check.
      - name: Check the public API contract
        working-directory: apps/python-executor
        run: python scripts/openapi_gate.py

      - name: Run TypeScript checks
        run: pnpm typecheck

      # apps/web declared vitest with zero tests for the life of the repo. It has
      # 7 now, but root `pnpm test` is scoped to test/** by vitest.config.ts, so
      # they would still never run. Invoked explicitly rather than making the
      # root config recursive, which would also sweep up e2e/ and qa/.
      - name: Run web workspace tests
        working-directory: apps/web
        run: pnpm exec vitest run

      - name: Run TypeScript tests
        run: pnpm test

      - name: Generate mobile closeout report
        run: python qa/mobile_e2e/generate_closeout_report.py

      - name: Upload closeout artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-closeout-report
          retention-days: 30
          path: |
            qa/results/mobile-e2e-closeout.md
            qa/results/mobile-e2e-closeout.json

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          pip install -r apps/python-executor/requirements.txt

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts both servers itself (uvicorn on 8100, next
      # dev on 3100) and health-gates on them, so nothing needs starting here.
      #
      # Two projects, one invocation: `chromium` is the 48 functional tests,
      # `authz` is the 10-test security lane (e2e/authz*.spec.ts). Deliberately
      # NOT split into two steps -- the config sets reuseExistingServer:false, so
      # a second invocation would pay for a second `next dev` boot to buy a
      # separate check mark. Playwright already prefixes every result with its
      # project name, so a failure reads as [authz] or [chromium] either way.
      #
      # The caveat that used to live here is resolved. The config previously set
      # AUTH_MODE=none on both servers, and middleware.py early-returns on that
      # -- bypassing the API-key check, RBAC, CSRF and tenant resolution -- so
      # all 48 tests ran against an app with no authorization and structurally
      # could not fail on an authz regression (#139). AUTH_MODE is now unset
      # (which leaves auth ON; unset is not the same as "none"), and the authz
      # lane exists to exercise what that turns back on: authentication, role
      # capability, the tenant boundary and the collab WebSocket handshake.
      #
      # That lane was checked against a deliberately broken build rather than
      # only a green one: re-run with AUTH_MODE=none, 8 of its 10 tests fail.
      # The 2 that still pass are correct to -- /health is exempt by design, and
      # /api/admin/v1 needs an admin JWT that AUTH_MODE does not grant.
      #
      # RM_E2E_ALLOW_DESTRUCTIVE=1 is REQUIRED here, not an optimisation. The
      # flag exists to stop five tests from writing things a real deployment
      # cannot take back (self-serve signup, POST /api/v1/import, deactivating
      # the shared connector). None of that applies to CI: playwright.config.ts
      # `rm -f`s the SQLite file at boot, so this job's database is created and
      # discarded within the step. Leaving the flag unset here would skip both
      # tenant-boundary tests -- the only cross-tenant isolation coverage the
      # Playwright suite has, and two of the eight that the AUTH_MODE=none
      # mutation above depends on. The gate would then be protecting an
      # ephemeral database from writes, at the cost of the security coverage
      # this lane was added for (#139).
      - name: Run Playwright suite (functional + authz lanes)
        env:
          PYTHON_BIN: python
          RM_E2E_ALLOW_DESTRUCTIVE: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          retention-days: 7
          path: |
            playwright-report
            test-results

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SAMPLE_KEYSTORE_BASE64: ${{ secrets.ANDROID_SAMPLE_KEYSTORE_BASE64 }}
      ANDROID_SAMPLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SAMPLE_KEYSTORE_PASSWORD }}
      ANDROID_SAMPLE_KEY_ALIAS: ${{ secrets.ANDROID_SAMPLE_KEY_ALIAS }}
      ANDROID_SAMPLE_KEY_PASSWORD: ${{ secrets.ANDROID_SAMPLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - uses: android-actions/setup-android@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/python-executor/requirements.txt

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile Android modules and JVM tests
        working-directory: packages/sdk-android
        run: ./gradlew --no-daemon --stacktrace :rulemind-core:test :sample-app:test :sample-app:assembleDebug :sample-app:assembleAndroidTest

      - name: Build signed sample release APK
        if: ${{ env.ANDROID_SAMPLE_KEYSTORE_BASE64 != '' && env.ANDROID_SAMPLE_KEYSTORE_PASSWORD != '' && env.ANDROID_SAMPLE_KEY_ALIAS != '' && env.ANDROID_SAMPLE_KEY_PASSWORD != '' }}
        working-directory: packages/sdk-android
        run: ./gradlew --no-daemon --stacktrace :sample-app:assembleRelease

      - name: Generate signed APK metadata
        if: ${{ env.ANDROID_SAMPLE_KEYSTORE_BASE64 != '' && env.ANDROID_SAMPLE_KEYSTORE_PASSWORD != '' && env.ANDROID_SAMPLE_KEY_ALIAS != '' && env.ANDROID_SAMPLE_KEY_PASSWORD != '' }}
        run: |
          APK_PATH="$(find packages/sdk-android/sample-app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          shasum -a 256 "$APK_PATH" > packages/sdk-android/sample-app/build/outputs/apk/release/SHA256SUMS.txt
          python - <<'PY'
          import json
          import pathlib
          apk_dir = pathlib.Path("packages/sdk-android/sample-app/build/outputs/apk/release")
          apk_path = next(apk_dir.glob("*.apk"))
          metadata = {
              "artifact": apk_path.name,
              "path": str(apk_path),
          }
          (apk_dir / "release-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          PY

      - name: Upload Android artifacts
        # Diagnostics only, and only when there is something to diagnose.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-sample-artifacts
          retention-days: 14
          path: |
            qa/results/mobile-e2e-backend.log
            packages/sdk-android/sample-app/build/reports

      - name: Upload signed sample APK
        # The signed APK is a real deliverable, so it uploads on success — but only
        # the APK and its checksums, never the whole build/outputs tree.
        if: ${{ env.ANDROID_SAMPLE_KEYSTORE_BASE64 != '' && env.ANDROID_SAMPLE_KEYSTORE_PASSWORD != '' && env.ANDROID_SAMPLE_KEY_ALIAS != '' && env.ANDROID_SAMPLE_KEY_PASSWORD != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-sample-release-apk
          retention-days: 30
          path: |
            packages/sdk-android/sample-app/build/outputs/apk/release/*.apk
            packages/sdk-android/sample-app/build/outputs/apk/release/SHA256SUMS.txt
            packages/sdk-android/sample-app/build/outputs/apk/release/release-metadata.json

  flutter:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/python-executor/requirements.txt

      - name: Install Flutter package dependencies
        working-directory: packages/sdk-flutter
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: packages/sdk-flutter
        run: dart analyze --no-fatal-warnings

      - name: Run Flutter package tests
        working-directory: packages/sdk-flutter
        run: flutter test

      # ~200 widget tests that ran in no workflow at all: the 54-case responsive
      # matrix in demo-app, the 126-case one in the SDK example, and the harness
      # self-test in flutter-ui. Before the emulator step on purpose -- a layout
      # regression should fail in seconds, not after a 12-minute emulator boot.
      - name: Analyze and test the demo app
        working-directory: demo-app
        run: |
          flutter pub get
          dart analyze --no-fatal-warnings
          flutter test

      - name: Test the shared UI package
        working-directory: packages/flutter-ui
        run: |
          flutter pub get
          dart analyze --no-fatal-warnings
          flutter test

      - name: Install example app dependencies
        working-directory: packages/sdk-flutter/example
        run: flutter pub get

      - name: Analyze and test the SDK example app
        working-directory: packages/sdk-flutter/example
        run: |
          dart analyze --no-fatal-warnings
          flutter test

      - name: Verify pub publish readiness
        working-directory: packages/sdk-flutter
        run: |
          # Earlier build/emulator steps regenerate checked-in files (e.g.
          # example/android/gradle.properties); restore tracked files so the
          # readiness dry-run reflects the committed state, not build output.
          git checkout -- . 2>/dev/null || true
          dart pub publish --dry-run

      - name: Upload Flutter artifacts
        # Only on failure: a green run does not need a build tarball. Previously this
        # uploaded the entire example/build tree (~440 MB) on every run, which alone
        # accounted for ~96% of the account's artifact storage.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flutter-example-artifacts
          retention-days: 7
          path: |
            qa/results/mobile-e2e-backend.log
            packages/sdk-flutter/example/build/**/reports/**
            packages/sdk-flutter/example/build/**/*.json

  # ── Emulator jobs — workflow_dispatch ONLY ──────────────────────────────────
  # Split out of `android` and `flutter` so a push stops paying for two emulator
  # boots (~15-25 min each, and failing since the runner-image rollout in #133).
  # The coverage is not deleted, only made opt-in: dispatch this workflow to run
  # it. Everything else in those jobs -- dart analyze, ~230 widget tests, gradle
  # JVM tests, pub publish readiness -- still gates every relevant push.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - uses: android-actions/setup-android@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/python-executor/requirements.txt

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build instrumentation APKs
        working-directory: packages/sdk-android
        run: ./gradlew --no-daemon --stacktrace :sample-app:assembleDebug :sample-app:assembleAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start FastAPI backend
        run: |
          bash qa/mobile_e2e/start_fastapi.sh
          bash qa/mobile_e2e/wait_for_health.sh

      - name: Run Android emulator E2E
        # KNOWN BROKEN BY GITHUB, NOT BY THIS REPO -- see issue #133.
        # The emulator booted on runner image ubuntu-24.04 20260816.277.1
        # and stopped booting on 20260823.283.1: "Timeout waiting for
        # emulator to boot". main went green -> red with no emulator config
        # change. The documented KVM udev rule was already present, headless
        # emulator options did not help, and ubuntu-22.04 is not usable
        # because android-actions/setup-android@v3 fails on it.
        #
        # No continue-on-error: this job only runs on workflow_dispatch, so a
        # red result is the signal you asked for rather than merge friction.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          script: cd packages/sdk-android && ./gradlew --no-daemon --stacktrace :sample-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.backendUrl=http://10.0.2.2:8080 -Pandroid.testInstrumentationRunnerArguments.adminEmail=admin@rulemind.local -Pandroid.testInstrumentationRunnerArguments.adminPassword=rulemind-admin

      - name: Stop FastAPI backend
        if: always()
        run: bash qa/mobile_e2e/stop_fastapi.sh

