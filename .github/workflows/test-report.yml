# Publish test results to the run page — the cheapest reporting this repo can have.
#
# CONTEXT. Actions has been refusing to START jobs for this repo's entire recent history: every
# run fails in 3-12 seconds with ZERO steps executed and no runner assigned. That is a BILLING
# BLOCK, not an exhausted quota and not a test failure -- GitHub's annotation on each failed job
# reads "The job was not started because recent account payments have failed or your spending
# limit needs to be increased". Consumption is already ~0, so trimming workflows saves nothing.
# So this workflow is written to be useful the day jobs can start and to cost nothing before
# then. It is `workflow_dispatch` plus a path filter, NOT push-on-everything.
#
# It reuses scripts/run_all_tests.sh -- the same script that generates the committed
# TEST_RESULTS.md -- so the numbers on GitHub and the numbers in the repo come from one code
# path instead of two definitions of "the tests".
name: test-report

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Lanes to run (space separated), e.g. `python web rust`"
        required: false
        default: "python web rust contracts"
  pull_request:
    paths:
      - "scripts/run_all_tests.sh"
      - "scripts/render_test_report.py"
      - ".github/workflows/test-report.yml"

concurrency:
  group: test-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # Every other workflow in this repo has NO timeout, so a hung job burns the full 6-hour
    # default against a quota that is already exhausted. 45 minutes is generous for these lanes.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rulemind
          POSTGRES_PASSWORD: rulemind
          POSTGRES_DB: rulemind
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U rulemind" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: |
          # The script resolves the interpreter as .venv-rulemind/bin/python, so the venv has to
          # exist here too rather than the runner's bare python3 -- same path locally and in CI.
          python3 -m venv .venv-rulemind
          ./.venv-rulemind/bin/pip install --quiet -r apps/python-executor/requirements.txt
          pnpm install --frozen-lockfile

      - name: Run all lanes
        id: run
        continue-on-error: true
        env:
          RULEMIND_TEST_PG_URL: postgresql://rulemind:rulemind@127.0.0.1:55432/rulemind
        run: bash scripts/run_all_tests.sh ${{ github.event.inputs.lanes || 'python web contracts' }}

      - name: Upload machine-readable results
        # NOT `if: failure()`. Every existing artifact upload in this repo is failure-only, so a
        # green run publishes nothing and there is no way to see what actually passed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            TEST_RESULTS.md
          retention-days: 14

      # render_test_report.py writes to $GITHUB_STEP_SUMMARY itself when the variable is set, so
      # the table lands on the run page with no extra action and no extra minutes.
      - name: Fail if any lane failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "One or more lanes failed — see the job summary above." >&2
          exit 1
