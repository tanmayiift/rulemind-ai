name: load-test

# Deliberately NOT on pull_request. Two reasons, both measured:
#
#  1. test/load/evaluate.k6.js:13 defaults RULE_ID to the literal "replace-me",
#     so without a lookup step every request 404s and the http_req_failed
#     threshold (rate<0.01) blows through immediately.
#  2. Its latency threshold was p(95)<500 at 50 VUs. E2E_TEST_PLAN.md section 11
#     measured that on PostgreSQL with 4 workers and the limiter off; this job
#     runs a single-worker uvicorn on SQLite and will not hold it. It is now
#     P95_MS, set per-job below, so the ceiling matches the configuration under
#     test instead of failing for being a different one.
#
# So it runs on demand. It no longer merely "reports": both k6 steps gate the
# job. They did not until 2026-09-19, and in that time the evaluate sweep's
# correctness check failed 100% of the time while the workflow stayed green --
# see the comments on each step.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    # SELF-HOSTED, like every other workflow here. This was `ubuntu-latest` long after the others
    # were ported, which meant it could not run AT ALL: GitHub-hosted jobs for this repository are
    # blocked and execute `steps: 0`. A workflow that cannot start is worse than a missing one --
    # it appears in the Actions tab and looks like coverage.
    #
    # It also makes the thresholds meaningful again. The comment at the top of this file says a
    # 2-core GitHub runner will not hold p(95)<500; this runner is the machine the numbers in
    # docs/PERFORMANCE.md were measured on, so the result is comparable to them.
    runs-on: [self-hosted, rulemind]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # NO actions/setup-python. The host provides 3.11 and the venv is provisioned the same way
      # self-hosted-tests.yml does it -- outside the workspace, so it survives between runs while
      # the checkout stays clean. Bare `python3` on this host is Homebrew 3.14, which has no
      # psycopg2-binary wheel; that mistake cost a CI run earlier and is why the interpreter is
      # pinned explicitly rather than assumed.
      #
      # This also retires Dependabot #158 (actions/setup-python 5 -> 7): the action is gone.
      - name: Provision the Python venv
        run: |
          set -eu
          VENV="$HOME/.cache/rulemind-ci-venv"
          PY=""
          for c in python3.11 python3.12 "$HOME/.local/opt/python311/bin/python3"; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "::error::no python3.11/3.12 found. Bare python3 is $(python3 -V 2>&1)."
            exit 1
          fi
          if [ ! -x "$VENV/bin/python" ]; then "$PY" -m venv "$VENV"; fi
          "$VENV/bin/pip" install -q --upgrade pip
          # NOT `|| true`: a swallowed install failure means the load test runs against whatever
          # happened to be in the venv already.
          "$VENV/bin/pip" install -q -r apps/python-executor/requirements.txt
          ln -sfn "$VENV" .venv-rulemind
          .venv-rulemind/bin/python -V

      # ITS OWN PORT, like the QA lane. This workflow starts a throwaway backend and then grades
      # whatever answers on the port -- so if the developer's compose stack is up on 8080 (this
      # is a self-hosted runner, so "the developer's machine" IS the runner), `start_fastapi.sh`
      # fails to bind and every k6 request grades the compose API instead. The numbers would look
      # plausible and measure the wrong server.
      #
      # 8124, one above the QA lane's 8123, so the two can never collide either.
      - name: Start FastAPI backend
        env:
          RULEMIND_E2E_PORT: "8124"
          # THE LIMITER OFF, which is what rate_limit.py's own docstring prescribes: "Set
          # RATE_LIMIT_ENABLED=0 to switch limiting off entirely -- that is the supported way to
          # run a load test or benchmark without the limiter shaping the result."
          #
          # It was never set, so this workflow was measuring the rate limiter rather than the
          # engine, and its verdict depended on whether the run happened to stay under the cap.
          # The tenant-wide default is 1500 rpm; a 30s run at 50 VUs lands either side of that
          # depending only on how fast the machine is that minute:
          #
          #   2026-09-19 14:05   1426 requests   0.00% failed   PASS
          #   2026-09-19 20:46   2014 requests  25.57% failed   FAIL  (exactly 1499 succeeded)
          #   2026-09-19 20:48   1990 requests  24.67% failed   FAIL  (exactly 1499 succeeded)
          #
          # "Exactly 1499 twice" is the tell -- a ceiling, not contention. The earlier greens
          # were not evidence the system was fast; they were evidence the run was small enough
          # to fit under the limit. A load test whose pass/fail flips on machine speed is worse
          # than none, because it reads as a performance regression.
          #
          # The limiter has its own coverage (tests/test_rate_limit*.py, and saturation.k6.js
          # treats 429 as correct load-shedding). This lane measures decision throughput.
          RATE_LIMIT_ENABLED: "0"
          # start_fastapi.sh otherwise resolves bare `python3` (Homebrew 3.14, no uvicorn) and
          # fails as "timed out waiting for backend health" -- a message that points at the
          # wrong thing entirely.
          RULEMIND_PYTHON_BIN: ${{ github.workspace }}/.venv-rulemind/bin/python
        run: |
          bash qa/mobile_e2e/start_fastapi.sh
          bash qa/mobile_e2e/wait_for_health.sh

      # The script needs a real rule id; its default is the string
      # "replace-me", which 404s on every request.
      - name: Resolve a seeded rule id
        id: rule
        run: |
          RULE_ID=$(curl -sf -H "x-api-key: $RM_KEY" "$RM_BASE/api/v1/rules" \
            | .venv-rulemind/bin/python -c "import json,sys; rs=json.load(sys.stdin); print(rs[0]['id'] if rs else '')")
          if [ -z "$RULE_ID" ]; then
            echo "no seeded rule found - cannot run a meaningful load test" >&2
            exit 1
          fi
          echo "id=$RULE_ID" >> "$GITHUB_OUTPUT"
          echo "using rule $RULE_ID"
        env:
          RM_BASE: http://127.0.0.1:8124
          RM_KEY: rm_live_devlocaltenantkey000000000000

      # k6 comes from the host (Homebrew) rather than grafana/setup-k6-action, which downloads a
      # linux build. Checked, not assumed: `k6 v2.2.0 ... darwin/arm64` is on PATH here.
      - name: Check k6 is available
        run: k6 version

      # NO continue-on-error. It was here, and it hid a script that was wrong in every run:
      # the "has outcome" check read `body.outcome` while POST /api/v1/rules/{id}/test returns
      # the outcome nested under `result`. Every request failed that check -- 0 of 1398 -- and
      # the workflow reported SUCCESS, because k6's non-zero exit was swallowed and the script
      # declared no `checks` threshold either. Two independent reasons a 100% failure rate was
      # invisible. A load test that cannot fail the job is a status badge, not a test.
      - name: Run k6
        env:
          BASE_URL: http://127.0.0.1:8124
          RULE_ID: ${{ steps.rule.outputs.id }}
          API_KEY: rm_live_devlocaltenantkey000000000000
          # The latency contract, overridable without editing the script. 500 was measured on
          # PostgreSQL with 4 workers and the limiter off (E2E_TEST_PLAN.md s11); this job runs a
          # single-worker uvicorn on SQLite, so gating on 500 here would fail for the
          # configuration rather than for a regression. docs/PERFORMANCE.md holds the real
          # comparison.
          P95_MS: "3000"
        run: k6 run --summary-export=k6-summary.json test/load/evaluate.k6.js

      # test/load/saturation.k6.js had never been executed by any workflow. It answers a
      # different question from evaluate.k6.js: not "is p95 acceptable at 50 VUs" but "where
      # does this fall over, and does it shed load or collapse". That is the number the the deployed instance
      # sizing depends on. Same runner, same server, so it is nearly free to add here -- and
      # this workflow is workflow_dispatch only, so it costs nothing per PR.
      # ARM THE SWEEP BEFORE RUNNING IT. Without this it measures a healthy server, and its
      # assertion -- "a decision must not be derived from a variable that failed" -- never
      # executes, because no variable ever fails. It printed PASS in run 35430953581 on exactly
      # that basis. The script explains why pool size alone does not reproduce it.
      - name: Arm the saturation harness
        run: |
          .venv-rulemind/bin/python test/load/saturation_setup.py \
            --base-url http://127.0.0.1:8124

      - name: Run k6 saturation sweep
        env:
          # BASE_URL and API_KEY, NOT RM_BASE. saturation.k6.js reads __ENV.BASE_URL (:67) and
          # __ENV.API_KEY (:68); RM_BASE is the variable the qa/e2e-full harness uses, and it was
          # set here by mistake. The step still passed, because the script's defaults are the
          # same host and the same dev key -- so it was reading neither of these values and
          # nobody could tell. Point this workflow at any other origin and it would have
          # silently load-tested localhost.
          BASE_URL: http://127.0.0.1:8124
          API_KEY: rm_live_devlocaltenantkey000000000000
        # NO continue-on-error, same reason as above. This sweep's threshold is a correctness
        # property (`unsound_decisions: count==0`) plus a harness property
        # (`degraded_responses: count>0`, i.e. "this run actually reached the condition it
        # asserts on"). Both are worth failing a job for.
        run: k6 run --summary-export=k6-saturation.json test/load/saturation.k6.js

      - name: Stop FastAPI backend
        if: always()
        run: bash qa/mobile_e2e/stop_fastapi.sh

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: k6-summary
          retention-days: 14
          path: |
            k6-summary.json
            k6-saturation.json
