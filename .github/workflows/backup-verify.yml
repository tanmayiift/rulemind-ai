name: backup-verify

# The point of running this on a schedule is that the SCRIPT stays exercised. A backup
# procedure first used during an incident is a procedure nobody knows is broken.
# GitHub-hosted, so the weekly schedule is back: a timer runs the default branch's code only.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: backup-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rulemind
          POSTGRES_PASSWORD: rulemind
          POSTGRES_DB: rulemind
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rulemind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rulemind:rulemind@127.0.0.1:55432/rulemind
      RULEMIND_CONFIG_KEY: ci-backup-verify-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/python-executor/requirements.txt
      - run: pip install -q -r apps/python-executor/requirements.txt

      # pg_dump/pg_restore must match the SERVER major version; a mismatch fails at RESTORE time,
      # which is exactly the silent-until-the-incident failure this job exists to catch. pg_dump
      # 18 against this 16 server restores with `unrecognized configuration parameter
      # "transaction_timeout"` (caught for real on 2026-09-16). The ubuntu-24.04 image ships the
      # 16 client; fail loudly if the majors ever disagree.
      - name: Check the postgres client matches the server major
        run: |
          set -eu
          d=/usr/lib/postgresql/16/bin
          [ -x "$d/pg_dump" ] && { echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; }
          CLIENT=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          SERVER=$(psql "$DATABASE_URL" -tAc "show server_version" | grep -oE '[0-9]+' | head -1)
          echo "client major=$CLIENT  server major=$SERVER"
          [ "$CLIENT" = "$SERVER" ] || {
            echo "::error::pg_dump $CLIENT against a postgres $SERVER server -- the restore will fail"
            exit 1; }

      - name: Create schema and seed a chained audit trail
        working-directory: apps/python-executor
        run: |
          python - <<'PY'
          from app.storage import Storage
          storage = Storage()
          tenant = storage.default_tenant_id
          for i in range(5):
              storage.add_audit_event({"event_type": "policy_promoted", "detail": f"seed {i}"}, tenant_id=tenant)
          storage.add_decision({"policy_id": "p", "outcome": "approve", "payload": {}}, tenant_id=tenant)
          print("seeded", storage.verify_audit_chain(tenant_id=tenant))
          PY

      # The real assertion: dump -> restore into a scratch database -> verify tables, row
      # counts and the audit chain -> drop the scratch. Non-zero exit fails the job.
      - name: Back up and prove the backup restores
        working-directory: apps/python-executor
        run: python scripts/backup_verify.py --out "$RUNNER_TEMP/backups"
