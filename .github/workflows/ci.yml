name: ci

on:
  # No push trigger. A PR already ran this, so re-running it on the merge commit
  # bought a duplicate of a result we had -- and this workflow builds two docker
  # images, which is most of its cost.
  pull_request:
  workflow_dispatch:

# This workflow had no concurrency group, so every push to a PR branch ran a
# full duplicate alongside the one it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Packaging smoke test, not a correctness gate -- and the bulk of this
      # job's minutes. Dispatch the workflow when you actually want to know the
      # images still build; lint/test/build gate every PR regardless.
      - if: github.event_name == 'workflow_dispatch'
        run: docker build -t rulemind-web:${{ github.sha }} -f apps/web/Dockerfile .
      - if: github.event_name == 'workflow_dispatch'
        run: docker build -t rulemind-python-executor:${{ github.sha }} -f apps/python-executor/Dockerfile .

  # ---------------------------------------------------------------------------
  # Schema drift gate.
  #
  # Migration 0001 (20260326_0001_initial_schema.py) is `Base.metadata.create_all()`
  # against the LIVE models, not a pinned DDL snapshot. That means a fresh database
  # always ends up matching whatever the models say right now — so a model change
  # shipped WITHOUT a migration works perfectly in CI, in every developer's sandbox
  # and in every new environment, and is simply missing from the one database that
  # was created before the change: production.
  #
  # Because of that, the obvious `alembic upgrade head && alembic check` on an empty
  # database is worthless here — it passes unconditionally. The check has to be run
  # against a schema built the way production's was, i.e. from the code as it exists
  # on the BASE branch:
  #
  #   1. build the schema from the base ref  (0001 create_all = base models)
  #   2. `alembic upgrade head` with the PR's code  (applies migrations the PR adds)
  #   3. `alembic check`  (PR models vs that schema)
  #
  # A PR that adds a migration matching its model change: step 2 applies it, step 3
  # is clean. A PR that changes models and adds no migration: step 2 is a no-op and
  # step 3 fails with "New upgrade operations detected".
  #
  # The proper structural fix is to replace 0001 with a pinned initial schema so a
  # plain `alembic check` becomes meaningful; that is a change to
  # apps/python-executor/alembic/ and is not made here.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # scripts/smoke_compose.sh: the "it actually runs" half of the deployability gate, and the
  # other script in this repo that nothing invoked. verify_chart.py above asserts the SHAPE of
  # the manifests; this one boots the real stack and checks the things shape cannot show --
  # that the migration chain applies, that liveness survives the database going away, that the
  # web image does not contain the repo's .env, that the API does not run as root, and that a
  # decision completes end to end.
  #
  # workflow_dispatch only, deliberately. It builds both images and boots Postgres, Redis, the
  # API and the web app: several minutes of runner time per invocation, which is real budget on
  # a free plan. Run it before a release or after touching Dockerfiles, compose, or the
  # entrypoint -- not on every PR.
  # ---------------------------------------------------------------------------
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Full-stack smoke test
        run: bash scripts/smoke_compose.sh

  # ---------------------------------------------------------------------------
  # scripts/verify_chart.py exists and had never been run by anything. It asserts the
  # DEPLOYMENT contract on rendered manifests, which is the part `helm lint` and
  # `kubeconform -strict` cannot see: both reported a clean chart ("0 chart(s) failed",
  # "Valid: 11, Invalid: 0") while it could not actually deploy. The script reported 44
  # violations against that same chart. It shells out to `helm template`, so it needs helm
  # and nothing else -- about ten seconds.
  # ---------------------------------------------------------------------------
  chart-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
      - name: Verify the deployment contract on rendered manifests
        run: python scripts/verify_chart.py --chart helm/rulemind

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rulemind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rulemind_ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to resolve the base ref the schema is reconstructed from.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/python-executor/requirements.txt
      - run: pip install -r apps/python-executor/requirements.txt

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the schema from the base ref
        run: |
          set -euo pipefail
          rm -rf /tmp/base && mkdir -p /tmp/base
          # `git archive` instead of checkout: the working tree stays on the PR code.
          git archive "${{ steps.base.outputs.sha }}" apps/python-executor | tar -x -C /tmp/base
          cd /tmp/base/apps/python-executor
          python -m alembic -c alembic.ini upgrade head

      - name: Apply this PR's migrations
        working-directory: apps/python-executor
        run: python -m alembic -c alembic.ini upgrade head

      - name: alembic check (models vs migrations)
        working-directory: apps/python-executor
        run: |
          set -euo pipefail
          if ! python -m alembic -c alembic.ini check; then
            echo "::error::Models changed without a matching Alembic migration."
            echo "Generate one with:  cd apps/python-executor && alembic revision --autogenerate -m '<description>'"
            echo "Do NOT rely on migration 0001's create_all — it only covers databases created after your change."
            exit 1
          fi
