name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t rulemind-web:${{ github.sha }} -f apps/web/Dockerfile .
      - run: docker build -t rulemind-python-executor:${{ github.sha }} -f apps/python-executor/Dockerfile .
