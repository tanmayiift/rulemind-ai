# The full regression, on a self-hosted runner.
#
# WHY THIS EXISTS. GitHub-hosted Actions will not start jobs for this repository: every workflow
# has zero successes, and the annotation on each failed job reads "The job was not started
# because recent account payments have failed or your spending limit needs to be increased." It
# is a BILLING BLOCK, not an exhausted quota — jobs are assigned no runner and execute `steps: 0`,
# so consumption is already ~0 and trimming workflows saves nothing.
#
# That left every test result in this repository as one person's local run on one machine. A
# self-hosted runner is free even on a private repo, and closes that gap without publishing the
# source.
#
# ── SECURITY: `workflow_dispatch` ONLY. NEVER `pull_request`. ─────────────────────────────────
#
# This runs on someone's actual machine with their credentials and their filesystem. A
# `pull_request` trigger would execute code from any PR branch — and this repo has 15 open
# bot-authored dependency PRs. `push` is excluded for the same reason plus a duller one: a
# 30-minute suite on every commit makes the machine unusable.
#
# If you add a trigger here, the question to answer first is "whose code runs, and who can
# change it" — not "would this be convenient".
#
# ── SETUP (one time) ──────────────────────────────────────────────────────────────────────────
#
#   cd ~/actions-runner
#   ./config.sh --url https://github.com/<owner>/<repo> \
#     --token "$(gh api -X POST /repos/<owner>/<repo>/actions/runners/registration-token --jq .token)" \
#     --name rulemind-local --labels self-hosted,macos,arm64,rulemind --unattended
#   ./run.sh                      # foreground; or ./svc.sh install && ./svc.sh start
#
# Then: Actions -> "self-hosted tests" -> Run workflow.
#
# The runner is a long-lived agent that executes workflow code as your user. Remove it with
# `./config.sh remove --token <removal-token>` when you no longer want that.

# SUPERSEDES test-report.yml, deleted 2026-09-16. That workflow ran the same
# scripts/run_all_tests.sh with the same `lanes` input and produced the same
# TEST_RESULTS.md — two files driving one script, which is the drift this session has
# spent its time finding elsewhere. This one has the provisioning that actually works
# (3.11 pin, pip-audit, the Rust binding, the Playwright browser), the schema reset, and
# grading from the per-lane TSV rather than the script's exit code.

name: self-hosted tests

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Lanes to run (space-separated), or blank for all'
        required: false
        default: ''

concurrency:
  group: self-hosted-tests
  cancel-in-progress: false

jobs:
  regression:
    runs-on: [self-hosted, rulemind]
    # The full suite is ~30 minutes (the Postgres lane alone is ~17). No job here has ever had a
    # timeout; without one a wedged lane holds the runner until the 6-hour default.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # LANGUAGE TOOLCHAINS come from the host (node, java, flutter, cargo). That part is
      # deliberate: a self-hosted runner already has the versions the team develops against, and
      # re-provisioning them would test something else.
      #
      # THE PYTHON VENV AND node_modules DO NOT. `actions/checkout` makes a FRESH CLONE in
      # _work/, and both are gitignored — the first run of this workflow failed here in three
      # seconds with ".venv-rulemind missing", which is the precondition doing its job. An
      # earlier version of this comment claimed provisioning was unnecessary; that assumed the
      # runner worked inside the developer's own checkout. It does not, and a CI run that
      # depends on a pre-existing venv is not reproducible, which is the point of having CI.
      #
      # The venv is built OUTSIDE the workspace and symlinked in, so it survives between runs
      # (pip then has almost nothing to do) while the checkout stays clean.
      - name: Provision the Python venv
        run: |
          set -eu
          VENV="$HOME/.cache/rulemind-ci-venv"

          # NOT bare `python3`. On this host that is Homebrew 3.14, which has no
          # psycopg2-binary wheel, so pip falls back to a SOURCE build, needs pg_config, and
          # dies with "Failed to build 'psycopg2-binary'" — a libpq error message for what is
          # really a wrong-interpreter problem. The second CI run failed exactly there.
          #
          # The project targets 3.11 (Docker image, CLAUDE.md, and the developer venv is
          # 3.11.16). Pick the first interpreter that the pinned wheels actually support, and
          # say so loudly if there is none rather than silently building from source.
          PY=""
          for c in python3.11 python3.12 "$HOME/.local/opt/python311/bin/python3"; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "::error::no python3.11/3.12 found. Bare python3 is $(python3 -V 2>&1), whose"
            echo "::error::wheels this project does not pin for. Install python@3.11."
            exit 1
          fi
          echo "using $PY ($("$PY" -V 2>&1))"

          # Rebuild if the cached venv is on a different interpreter than the one selected --
          # otherwise a host Python upgrade leaves a stale venv that fails in confusing ways.
          if [ -x "$VENV/bin/python" ] && \
             [ "$("$VENV/bin/python" -V 2>&1)" != "$("$PY" -V 2>&1)" ]; then
            echo "cached venv is $("$VENV/bin/python" -V 2>&1); rebuilding"
            rm -rf "$VENV"
          fi
          if [ ! -x "$VENV/bin/python" ]; then
            echo "creating $VENV"
            "$PY" -m venv "$VENV"
          fi
          "$VENV/bin/pip" install -q --upgrade pip
          # NOT `|| true`: if the requirements cannot be installed, the run must fail HERE with
          # that reason. A swallowed install failure means the suite silently tests whatever
          # was already in the venv — exactly how PR #170's un-installable numpy was first
          # reported as passing.
          "$VENV/bin/pip" install -q -r apps/python-executor/requirements.txt

          # pip-audit is NOT in requirements.txt (it is CI tooling, not a runtime dep), and
          # scripts/check_audit_ignores.py shells out to `<venv>/bin/python -m pip_audit`. Without
          # it that gate fails with "No module named pip_audit", which reads like a broken audit
          # rather than a missing tool. The first CI run failed exactly there.
          "$VENV/bin/pip" install -q pip-audit

          # The Rust core's Python binding. Without it, 3 tests SKIP instead of running, and CI
          # silently covers less than a developer's machine -- found by diffing skip reasons
          # between the two (CI skipped 29, local 26, and this was the whole difference). The
          # Rust engine is one of the five held to the parity corpus, so those 3 are not
          # optional coverage.
          if ! "$VENV/bin/python" -c "import rulemind_core_rs" >/dev/null 2>&1; then
            if command -v cargo >/dev/null 2>&1; then
              "$VENV/bin/pip" install -q maturin
              ( cd packages/rulemind-core-rs && "$VENV/bin/maturin" build --release -q \
                  -i "$VENV/bin/python" -o /tmp/rm-wheels ) \
                && "$VENV/bin/pip" install -q --force-reinstall /tmp/rm-wheels/*.whl \
                || echo "::warning::rulemind_core_rs failed to build; 3 Rust-core tests will skip"
            else
              echo "::warning::cargo not found; rulemind_core_rs unavailable, 3 tests will skip"
            fi
          fi

          ln -sfn "$VENV" .venv-rulemind
          .venv-rulemind/bin/python -V
          .venv-rulemind/bin/python -c "import rulemind_core_rs; print('rulemind_core_rs: ok')" \
            2>/dev/null || echo "rulemind_core_rs: NOT available (3 tests will skip)"

      - name: Provision node_modules
        run: |
          set -eu
          corepack enable >/dev/null 2>&1 || true
          pnpm install --frozen-lockfile
          # Playwright's browser build is pinned to its package version; a bumped
          # @playwright/test needs the matching browser or every browser test errors with
          # "Executable doesn't exist".
          npx playwright install chromium

      - name: Preconditions
        run: |
          set -u
          command -v docker >/dev/null || { echo "docker is required (Postgres lane + smoke)"; exit 1; }
          test -x .venv-rulemind/bin/python || { echo ".venv-rulemind missing after provisioning"; exit 1; }
          docker compose up -d db redis
          # NO SCHEMA RESET ANY MORE. This used to DROP the public schema of the database that
          # `make up` uses, because the PG lane shared it: if the app had written there under a
          # different RULEMIND_CONFIG_KEY, every test touching the default schema died on
          # InvalidToken ~16 minutes in.
          #
          # That fixed CI by destroying the maintainer's local workspace on every run -- this is a
          # self-hosted runner, so "the CI database" and "the database they were just using" are
          # the same one. run_all_tests.sh now creates and uses a SEPARATE database
          # (rulemind_lane) instead of policing a shared one, which removes the conflict rather
          # than resolving it in CI's favour.

      - name: Full regression
        # RULEMIND_REQUIRE_ALL_LANES: a SKIPPED lane fails the run here.
        #
        # The grading step below greps the per-lane TSV for "fail", and a skip is not a failure --
        # so a lane whose environment was not provisioned reported as a green regression. A local
        # run skipped BOTH the Postgres lane and the QA suites (port 8080 was occupied, and the
        # shared schema was contaminated) and still exited 0 with everything else green. On a
        # laptop a skip is reasonable; in CI, which provisions Postgres, Redis and the ports
        # itself, a skip means that provisioning broke and must be loud.
        env:
          RULEMIND_REQUIRE_ALL_LANES: "1"
        run: bash scripts/run_all_tests.sh ${{ inputs.lanes }}

      - name: Publish the summary
        if: always()
        run: |
          # $GITHUB_STEP_SUMMARY renders on the run page itself — the cheapest reporting there is,
          # and it means a result is readable without downloading an artifact.
          {
            echo "## Regression"
            echo
            cat TEST_RESULTS.md 2>/dev/null || echo "TEST_RESULTS.md was not generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TEST_RESULTS.md
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the run if any lane failed
        if: always()
        run: |
          # run_all_tests.sh writes a per-lane TSV. Grading from that rather than from the
          # script's exit code means a lane that fails late still fails the run.
          if grep -qiE '\tfail' test-results/summary.tsv 2>/dev/null; then
            echo "::error::one or more lanes failed"
            grep -iE '\tfail' test-results/summary.tsv
            exit 1
          fi
          echo "all lanes green"
